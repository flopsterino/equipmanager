Screens:
  scr_SetupDetail:
    Properties:
      Fill: RGBA(244, 245, 247, 1)
      LoadingSpinnerColor: =RGBA(0, 46, 101, 1)
      OnVisible: |-
        =If(
            !IsBlank(varCurrentSetup.'Id (ID)'),
            Set(varCurrentSetup, LookUp(Equipment_Setups, 'Id (ID)' = varCurrentSetup.'Id (ID)'))
        );
        Set(
            varSetupFields,
            Table(
                { FieldName: "Name",              FieldValue: Coalesce(varCurrentSetup.SetupName, "-") },
                { FieldName: "Campus",            FieldValue: Coalesce(varCurrentSetup.CurrentCampus.Value, "-") },
                { FieldName: "Room",            FieldValue: Coalesce(varCurrentSetup.CurrentLocation.Value, "-") },
                { FieldName: "Responsible person", FieldValue: Coalesce(varCurrentSetup.ResponsiblePerson.DisplayName, "-") },
                { FieldName: "Description",      FieldValue: Coalesce(varCurrentSetup.Description, "-") },
        { FieldName: "Commissioning required", FieldValue: Coalesce(varCurrentSetup.CommissioningRequired.Value, "-") },
        { FieldName: "Commissioning done",     FieldValue: If(
            IsEmpty(varCurrentSetup.CommissioningDone),
            "-",
            Concat(varCurrentSetup.CommissioningDone, Value, ", ")
        ) }
            )
        )
    Children:
      - conSetupDetail:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - conSetupHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 600, 108, 112)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - icoSetupBack:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Back to overview"
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(90, 101, 119, 1)
                        DisabledBorderColor: =RGBA(238, 241, 246, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =36
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(10, 74, 147, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.BackArrow
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Back(ScreenTransition.Fade)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(10, 74, 147, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Tooltip: ="Back"
                        Width: =36
                        X: =010
                        Y: =(Parent.Height - Self.Height) / 2
                  - conSetupTitleBlock:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =200
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =Parent.Width
                      Children:
                        - lblSetupTitle:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(23, 35, 58, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Self.Size * 2.9
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =If(Parent.Width < 400, 16, If(Parent.Width < 600, 18, 20))
                              Text: =Coalesce(varCurrentSetup.Titel, "No setup selected")
                              Width: =Parent.Width
                              X: =103
                        - lblSetupSubtitle:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(90, 101, 119, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              Height: =Self.Size * 2.9
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =Coalesce(varCurrentSetup.SetupName, "") & "   |   " &
                                 Coalesce(varCurrentSetup.CurrentCampus.Value, "?") & " / " &
                                 Coalesce(varCurrentSetup.CurrentLocation.Value, "?")
                              Width: =Parent.Width
                              X: =103
                  - icoSetupEdit:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Edit this setup"
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(0, 46, 101, 1)
                        DisabledBorderColor: =RGBA(238, 241, 246, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        DisplayMode: =If(IsBlank(varCurrentSetup.'Id (ID)'), DisplayMode.Disabled, DisplayMode.Edit)
                        FocusedBorderThickness: =4
                        Height: =36
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(10, 74, 147, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.Edit
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Set(varEditSetup, varCurrentSetup);
                          Navigate(scr_SetupEdit, ScreenTransition.Fade)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(10, 74, 147, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Tooltip: ="Edit setup"
                        Width: =36
                        X: =010
                        Y: =(Parent.Height - Self.Height) / 2
            - conSetupComm:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - lblSetupCommBadge:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Fill: |-
                          =With(
                              {
                                  req: Coalesce(varCurrentSetup.CommissioningRequired.Value, "None"),
                                  done: Concat(varCurrentSetup.CommissioningDone, Value, " | ")
                              },
                              If(
                                  req = "None",                       RGBA(27, 94, 52, 1),
                                  // Commissioned at this campus, among possibly several.
                                  !IsBlank(Find(req, done)),          RGBA(27, 94, 52, 1),
                                  // An extended commissioning covers the administrative one.
                                  req = "administrative"
                                      && !IsBlank(Find("extended", done)),
                                                                      RGBA(27, 94, 52, 1),
                                  IsBlank(done),                      RGBA(163, 18, 28, 1),
                                  // Something was done, but not what this asset needs.
                                  RGBA(138, 75, 0, 1)
                              )
                          )
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Self.Size * 2.9
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =0
                        Size: =11
                        Text: |-
                          =With(
                              {
                                  req: Coalesce(varCurrentSetup.CommissioningRequired.Value, "None"),
                                  done: Concat(varCurrentSetup.CommissioningDone, Value, " | ")
                              },
                              If(
                                  req = "None",                       "Not required",
                                  // Commissioned at this campus, among possibly several.
                                  !IsBlank(Find(req, done)),          "Commissioned",
                                  // An extended commissioning covers the administrative one.
                                  req = "administrative"
                                      && !IsBlank(Find("extended", done)),
                                                                      "Commissioned",
                                  IsBlank(done),                      "Not commissioned",
                                  // Something was done, but not what this asset needs.
                                  "Incomplete"
                              )
                          )
                        Visible: =!IsBlank(varCurrentSetup.'Id (ID)')
                        Width: =170
                        X: =103
                  - lblSetupStatusBadge:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Fill: |-
                          =If(
                              IsBlank(varCurrentSetup.Status.Value), RGBA(139, 148, 163, 1),
                              varCurrentSetup.Status.Value = "Operational", RGBA(27, 94, 52, 1),
                              RGBA(138, 75, 0, 1)
                          )
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Self.Size * 2.9
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =0
                        Size: =11
                        Text: =Coalesce(varCurrentSetup.Status.Value, "No status")
                        Visible: =!IsBlank(varCurrentSetup.'Id (ID)')
                        Width: =170
                        X: =103
            - conSetupBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - lblSetupFieldsHeader:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(90, 101, 119, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Fill: =RGBA(238, 241, 246, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: ="DETAILS"
                        Width: =Parent.Width - 16
                        X: =103
                  - galSetupFields:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(238, 241, 246, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =CountRows(varSetupFields) * 44
                        Items: =varSetupFields
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        ShowScrollbar: =false
                        TemplateSize: =44
                        Width: =Parent.Width - 16
                      Children:
                        - lblSetupFieldName:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(90, 101, 119, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =44
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =8
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =ThisItem.FieldName
                              Width: =Min(Parent.TemplateWidth * 0.45, 210)
                              Wrap: =false
                        - lblSetupFieldValue:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(23, 35, 58, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =8
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =ThisItem.FieldValue
                              Width: =Parent.TemplateWidth - lblSetupFieldName.Width - 8
                              Wrap: =false
                              X: =lblSetupFieldName.Width
                        - recSetupFieldSep:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(232, 236, 242, 1)
                              Height: =1
                              OnSelect: =Select(Parent)
                              Visible: =ThisItem.IsSelected
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 1
                  - lblSetupAssetsHeader:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(90, 101, 119, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Fill: =RGBA(238, 241, 246, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: |-
                          ="ASSETS IN THIS SETUP" &
                          If(
                              CountRows(galSetupAssets.AllItems) = 0,
                              "",
                              "   (" & CountRows(galSetupAssets.AllItems) & ")"
                          )
                        Width: =Parent.Width - 16
                        X: =103
                  - galSetupAssets:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(238, 241, 246, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: |-
                          =Max(
                              CountRows(
                                  Filter(Equipment_Assets, varCurrentSetup.Titel in Setups.Value)
                              ),
                              1
                          ) * If(Parent.Width < 600, 94, 66)
                        Items: |-
                          =Filter(
                              Equipment_Assets,
                              varCurrentSetup.Titel in Setups.Value
                          )
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        ShowScrollbar: =false
                        TemplateSize: =If(Parent.Width < 600, 94, 66)
                        Width: =Parent.Width - 16
                      Children:
                        - lblSetupAssetTitle:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(23, 35, 58, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =If(Parent.TemplateWidth < 600, 62, 22)
                              OnSelect: |-
                                =Set(varCurrentAsset, ThisItem);
                                Navigate(scr_AssetDetail, ScreenTransition.Fade)
                              PaddingBottom: =0
                              PaddingLeft: =8
                              PaddingRight: =0
                              PaddingTop: =0
                              Text: |-
                                =ThisItem.Titel & " - " & ThisItem.DeviceName &
                                If(
                                    IsBlank(ThisItem.Manufacturer),
                                    "",
                                    "  (" & ThisItem.Manufacturer & ")"
                                )
                              Width: =Parent.TemplateWidth - 90
                              X: =4
                              Y: =6
                        - lblSetupAssetSub:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(90, 101, 119, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =20
                              OnSelect: |-
                                =Set(varCurrentAsset, ThisItem);
                                Navigate(scr_AssetDetail, ScreenTransition.Fade)
                              PaddingBottom: =0
                              PaddingLeft: =8
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: |-
                                ="SN " & Coalesce(ThisItem.SerialNumber, "-") &
                                 "   |   " & Coalesce(ThisItem.CurrentCampus.Value, "?") & " / " & Coalesce(ThisItem.'CurrentLocation (CurrentLocation0)'.Value, "?") &
                                 "   |   " & Coalesce(ThisItem.Status.Value, "")
                              Width: =Parent.TemplateWidth - 90
                              Wrap: =false
                              X: =4
                              Y: =lblSetupAssetTitle.Y + lblSetupAssetTitle.Height
                        - icoSetupAssetRemove:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: ="Remove this asset from the setup"
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =RGBA(163, 18, 28, 1)
                              DisabledBorderColor: =RGBA(238, 241, 246, 1)
                              DisabledColor: =RGBA(225, 223, 221, 1)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =20
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(10, 74, 147, 1)
                              HoverFill: =RGBA(253, 232, 234, 1)
                              Icon: =Icon.Cancel
                              OnSelect: =Set(varRemoveFromSetup, ThisItem)
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(10, 74, 147, 1)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Tooltip: ="Remove from setup"
                              Width: =20
                              X: =Parent.TemplateWidth - Self.Width - 10
                              Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                        - icoSetupAssetChevron:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: ="Open this asset"
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(139, 148, 163, 1)
                              DisabledBorderColor: =RGBA(238, 241, 246, 1)
                              DisabledColor: =RGBA(225, 223, 221, 1)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =20
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(10, 74, 147, 1)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Icon: =Icon.ChevronRight
                              OnSelect: |-
                                =Set(varCurrentAsset, ThisItem);
                                Navigate(scr_AssetDetail, ScreenTransition.Fade)
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(10, 74, 147, 1)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =20
                              X: =Parent.TemplateWidth - Self.Width - 40
                              Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                        - recSetupAssetSep:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(232, 236, 242, 1)
                              Height: =1
                              OnSelect: |-
                                =Set(varCurrentAsset, ThisItem);
                                Navigate(scr_AssetDetail, ScreenTransition.Fade)
                              Visible: =ThisItem.IsSelected
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 1
                  - lblNoSetupAssets:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(139, 148, 163, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Font: =Font.'Segoe UI'
                        Height: =Self.Size * 4.2
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =0
                        Size: =11
                        Text: |-
                          ="No assets carry this setup. An asset belongs here when its Setup field reads exactly """
                           & Coalesce(varCurrentSetup.Titel, "?") & """."
                        Visible: =CountRows(galSetupAssets.AllItems) = 0
                        Width: =Parent.Width - 16
                        X: =103
                  - conSetupAddField:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: |-
                          =22 + 40 + 8 +
                          If(
                              IsEmpty(colSetupAddPick),
                              35,
                              RoundUp(CountRows(colSetupAddPick) / If(Parent.Width < 600, 1, 3), 0) * 34
                          ) +
                          If(IsBlank(txtSetupAddSearch.Text), 0, 190)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =Parent.Width - 16
                      Children:
                        - lblSetupAddCaption:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(90, 101, 119, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: ="ADD AN ASSET TO THIS SETUP"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                              X: =103
                        - galSetupAddChosen:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderColor: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: |-
                                =If(
                                    IsEmpty(colSetupAddPick),
                                    0,
                                    RoundUp(
                                        CountRows(colSetupAddPick) / If(Parent.Width < 600, 1, 3),
                                        0
                                    ) * 34
                                )
                              Items: =colSetupAddPick
                              LayoutMinHeight: =0
                              LayoutMinWidth: =16
                              ShowScrollbar: =false
                              TemplateSize: =34
                              Visible: =!IsEmpty(colSetupAddPick)
                              Width: =Parent.Width
                              WrapCount: =If(Parent.Width < 600, 1, 3)
                            Children:
                              - btnSetupAddChip:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(0, 46, 101, 1)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =1
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(139, 148, 163, 1)
                                    DisabledFill: =RGBA(242, 242, 241, 0)
                                    Fill: =RGBA(0, 46, 101, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =28
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =RGBA(163, 18, 28, 1)
                                    OnSelect: =Remove(colSetupAddPick, LookUp(colSetupAddPick, Value = ThisItem.Value))
                                    PressedBorderColor: =RGBA(0, 69, 120, 1)
                                    PressedColor: =RGBA(255, 255, 255, 1)
                                    PressedFill: =RGBA(10, 74, 147, 1)
                                    RadiusBottomLeft: =14
                                    RadiusBottomRight: =14
                                    RadiusTopLeft: =14
                                    RadiusTopRight: =14
                                    Size: =10
                                    Text: =ThisItem.Value & "   x"
