                  - btnSetupAddAsset:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        DisabledFill: =RGBA(233, 237, 243, 1)
                        DisplayMode: =If(IsEmpty(colSetupAddPick) || IsBlank(varCurrentSetup.'Id (ID)'), DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =RGBA(0, 46, 101, 1)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(10, 74, 147, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =ForAll(
                              colSetupAddPick As p,
                              // An asset already in this setup is skipped rather than written in twice.
                              If(
                                  IsBlank(
                                      LookUp(LookUp(Equipment_Assets, 'Id (ID)' = p.Id).Setups, Value = varCurrentSetup.Titel)
                                  ),
                                  Patch(
                                      Equipment_Assets,
                                      LookUp(Equipment_Assets, 'Id (ID)' = p.Id),
                                      {
                                          // The asset keeps the setups it already had, with this one added.
                                          // Two tables are joined by wrapping each in a record and ungrouping
                                          // them - a table has no append.
                                          Setups: Ungroup(
                                              Table(
                                                  { part: ForAll(
                                                      LookUp(Equipment_Assets, 'Id (ID)' = p.Id).Setups As e,
                                                      { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference", Id: e.Id, Value: e.Value }
                                                  ) },
                                                  { part: Table(
                                                      { '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference", Id: varCurrentSetup.'Id (ID)', Value: varCurrentSetup.Titel }
                                                  ) }
                                              ),
                                              part
                                          )
                                      }
                                  )
                              )
                          );
                          If(
                              IsEmpty(Errors(Equipment_Assets)),
                              Notify(
                                  CountRows(colSetupAddPick) & " asset(s) added to " & varCurrentSetup.Titel & ".",
                                  NotificationType.Success
                              );
                              Clear(colSetupAddPick),
                              Notify(
                                  "Could not add them: " & Concat(Errors(Equipment_Assets), Message, " | "),
                                  NotificationType.Error
                              )
                          )
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(10, 74, 147, 1)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =12
                        Text: |-
                          =If(
                              IsEmpty(colSetupAddPick),
                              "Add to setup",
                              "Add " & CountRows(colSetupAddPick) & " to setup"
                          )
                        Width: =If(Parent.Width < 600, Parent.Width - 16, 200)
