                  - lblResolveHeader:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(96, 94, 92, 1)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Fill: =RGBA(245, 245, 245, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: ="RESOLUTION"
                        Visible: =!varIsNewTicket
                        Width: =Parent.Width - 28
                        X: =103
                  - lblReportedMeta:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(96, 94, 92, 1)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Font: =Font.'Segoe UI'
                        Height: =Self.Size * 2.9
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: |-
                          ="Reported by " & Coalesce(varCurrentTicket.ReportedBy.DisplayName, "?") &
                           If(
                               IsBlank(varCurrentTicket.ReportedDate),
                               "",
                               " on " & Text(varCurrentTicket.ReportedDate, DateTimeFormat.ShortDateTime24)
                           ) &
                           If(
                               IsBlank(varCurrentTicket.ResolvedDate),
                               "",
