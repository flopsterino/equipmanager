App:
  Properties:
    OnStart: |-
      =Clear(colMoveBuffer);
      // Where the asset screen's back arrow should return to. Blank reads as false
      // anyway, but a variable the app never sets is one nobody can look up.
      Set(varAssetFromSetup, false);
      // Give colGroupFilter a schema before anything reads colGroupFilter.Value.
      // Collecting one row and clearing it is the plainest way to declare the
      // shape without leaving a row behind.
      Collect(colGroupFilter, { Value: "" });
      Clear(colGroupFilter);
      Collect(colCommDone, { Value: "" });
      Clear(colCommDone);
      // The setups an asset belongs to, while it is being edited. A multi-value
      // Lookup is a table of { Id, Value }, so the seed carries both.
      Collect(colAssetSetups, { Id: 0, Value: "" });
      Clear(colAssetSetups);
      // The assets picked to be added to a setup, before the add is committed.
      Collect(colSetupAddPick, { Id: 0, Value: "" });
      Clear(colSetupAddPick);
      // The assets a booking covers. One booking form, one row per device.
      Collect(colBkAssets, { Id: 0, Value: "" });
      Clear(colBkAssets);
      Set(varHomeTab, "assets"); Set(varBuildId, "2026-09-24 10:42")
    Theme: =PowerAppsTheme
