            - galEdPickDays:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =RGBA(232, 236, 242, 1)
                  Height: =Parent.Height
                  Items: |-
                    =With(
                        {
                            first: DateAdd(
                                varEdPickMonth,
                                -(Weekday(varEdPickMonth, StartOfWeek.Monday) - 1),
                                TimeUnit.Days
                            )
                        },
                        ForAll(
                            Sequence(42) As s,
                            With(
                                { d: DateAdd(first, s.Value - 1, TimeUnit.Days) },
                                {
                                    CellDate: d,
                                    DayNum: Day(d),
                                    InMonth: Month(d) = Month(varEdPickMonth)
                                }
                            )
                        )
                    )
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  ShowScrollbar: =false
                  TemplateSize: =42
                  Width: =Parent.Width - 16
                  WrapCount: =7
                Children:
                  - recEdPickCell:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(232, 236, 242, 1)
                        BorderThickness: =1
                        Fill: |-
                          =If(
                              ThisItem.CellDate = If(varEdPick = "last", varEdLast, varEdNext),
                                  RGBA(0, 46, 101, 1),
                              ThisItem.CellDate = Today(), RGBA(222, 236, 249, 1),
                              RGBA(255, 255, 255, 1)
                          )
                        Height: =Parent.TemplateHeight - 2
                        OnSelect: |-
                          =If(
                              varEdPick = "last",
                              Set(varEdLast, ThisItem.CellDate),
                              Set(varEdNext, ThisItem.CellDate)
                          );
                          Set(varEdPick, "")
                        Visible: =ThisItem.IsSelected
                        Width: =Parent.TemplateWidth - 2
                        X: =1
                        Y: =1
                  - lblEdPickDayNum:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: |-
                          =If(
                              ThisItem.CellDate = If(varEdPick = "last", varEdLast, varEdNext),
                                  RGBA(255, 255, 255, 1),
                              Not(ThisItem.InMonth), RGBA(203, 210, 221, 1),
                              RGBA(23, 35, 58, 1)
                          )
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                        Height: =Parent.TemplateHeight - 4
                        OnSelect: |-
                          =If(
                              varEdPick = "last",
                              Set(varEdLast, ThisItem.CellDate),
                              Set(varEdNext, ThisItem.CellDate)
                          );
                          Set(varEdPick, "")
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =ThisItem.DayNum
                        Width: =Parent.TemplateWidth
                        Y: =2
