                  - btnClearFilters:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(219, 219, 219, 1)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =1
                        Color: =RGBA(96, 94, 92, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        Height: =34
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(243, 242, 241, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Reset(drpFilterCampus);
                          Reset(drpFilterLocation);
                          Reset(drpFilterOwner);
                          Reset(drpFilterStatus)
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(16, 110, 190, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =11
                        Text: ="Clear filters"
                        Width: =If(Parent.Width < 640, Parent.Width - 24, 130)
            - conHomeTabs:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - btnTabAssets:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 120, 212, 1)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =1
                        Color: =If(varHomeTab = "assets", RGBA(255, 255, 255, 1), RGBA(0, 120, 212, 1))
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =If(varHomeTab = "assets", RGBA(0, 120, 212, 1), RGBA(255, 255, 255, 1))
                        Font: =Font.'Segoe UI'
                        Height: =34
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =If(varHomeTab = "assets", RGBA(16, 110, 190, 1), RGBA(235, 243, 252, 1))
