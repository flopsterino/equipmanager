                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =10
                              Text: ="ROOM"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                              X: =103
                        - drpFilterLocation:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              BorderColor: =RGBA(219, 219, 219, 1)
                              ChevronBackground: =RGBA(245, 245, 245, 1)
                              ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                              ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                              ChevronFill: =RGBA(50, 49, 48, 1)
                              ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                              ChevronHoverFill: =RGBA(50, 49, 48, 1)
                              Color: =RGBA(50, 49, 48, 1)
                              Default: ="All rooms"
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Font: =Font.'Segoe UI'
                              HoverBorderColor: =RGBA(16, 110, 190, 1)
                              HoverColor: =RGBA(50, 49, 48, 1)
                              HoverFill: =RGBA(245, 245, 245, 1)
                              Items: |-
                                =Ungroup(
                                    Table(
                                        { opt: Table({ Value: "All rooms" }) },
                                        { opt: ForAll(Choices(Equipment_Assets.'CurrentLocation (CurrentLocation0)') As c, { Value: c.Value }) }
                                    ),
                                    opt
                                )
                              Items.Value: =Value
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              PressedBorderColor: =RGBA(16, 110, 190, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 120, 212, 1)
                              SelectionColor: =RGBA(50, 49, 48, 1)
                              SelectionFill: =RGBA(0, 120, 212, 1)
                              Width: =Parent.Width
                  - conFltGroup:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: |-
                          =If(
                              Parent.Width < 640, Parent.Width - 24,
                              Parent.Width < 1100, (Parent.Width - 34) / 2,
                              (Parent.Width - 54) / 4
                          )
                      Children:
                        - lblFltGroup:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(96, 94, 92, 1)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =10
                              Text: ="RESEARCH GROUP (OWNER OR USER)"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                              X: =103
                        - drpFilterOwner:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              BorderColor: =RGBA(219, 219, 219, 1)
                              ChevronBackground: =RGBA(245, 245, 245, 1)
                              ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                              ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                              ChevronFill: =RGBA(50, 49, 48, 1)
                              ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                              ChevronHoverFill: =RGBA(50, 49, 48, 1)
                              Color: =RGBA(50, 49, 48, 1)
                              Default: ="All research groups"
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Font: =Font.'Segoe UI'
                              HoverBorderColor: =RGBA(16, 110, 190, 1)
                              HoverColor: =RGBA(50, 49, 48, 1)
                              HoverFill: =RGBA(245, 245, 245, 1)
                              Items: |-
                                =Ungroup(
                                    Table(
                                        { opt: Table({ Value: "All research groups" }) },
                                        { opt: ForAll(Choices(Equipment_Assets.OwnerGroup) As c, { Value: c.Value }) }
                                    ),
                                    opt
                                )
                              Items.Value: =Value
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              PressedBorderColor: =RGBA(16, 110, 190, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 120, 212, 1)
                              SelectionColor: =RGBA(50, 49, 48, 1)
                              SelectionFill: =RGBA(0, 120, 212, 1)
                              Width: =Parent.Width
                  - conFltStatus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: |-
                          =If(
                              Parent.Width < 640, Parent.Width - 24,
                              Parent.Width < 1100, (Parent.Width - 34) / 2,
                              (Parent.Width - 54) / 4
                          )
                      Children:
                        - lblFltStatus:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(96, 94, 92, 1)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =10
                              Text: ="STATUS"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                              X: =103
                        - drpFilterStatus:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              BorderColor: =RGBA(219, 219, 219, 1)
                              ChevronBackground: =RGBA(245, 245, 245, 1)
                              ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                              ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                              ChevronFill: =RGBA(50, 49, 48, 1)
                              ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                              ChevronHoverFill: =RGBA(50, 49, 48, 1)
                              Color: =RGBA(50, 49, 48, 1)
                              Default: ="All statuses"
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Font: =Font.'Segoe UI'
                              HoverBorderColor: =RGBA(16, 110, 190, 1)
                              HoverColor: =RGBA(50, 49, 48, 1)
                              HoverFill: =RGBA(245, 245, 245, 1)
                              Items: |-
                                =Ungroup(
                                    Table(
                                        { opt: Table({ Value: "All statuses" }) },
                                        { opt: ForAll(Choices(Equipment_Assets.Status) As c, { Value: c.Value }) }
                                    ),
                                    opt
                                )
                              Items.Value: =Value
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              PressedBorderColor: =RGBA(16, 110, 190, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 120, 212, 1)
                              SelectionColor: =RGBA(50, 49, 48, 1)
                              SelectionFill: =RGBA(0, 120, 212, 1)
