                      Children:
                        - lblTkSeverity:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(96, 94, 92, 1)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: ="SEVERITY"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                              X: =103
                        - drpTkSeverity:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              BorderColor: =RGBA(219, 219, 219, 1)
                              ChevronBackground: =RGBA(245, 245, 245, 1)
                              ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                              ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                              ChevronFill: =RGBA(50, 49, 48, 1)
                              ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                              ChevronHoverFill: =RGBA(50, 49, 48, 1)
                              Color: =RGBA(50, 49, 48, 1)
                              Default: |-
                                =Coalesce(
                                    varCurrentTicket.Severity.Value,
                                    First(Choices(Equipment_Tickets.Severity)).Value
                                )
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Font: =Font.'Segoe UI'
                              HoverBorderColor: =RGBA(16, 110, 190, 1)
                              HoverColor: =RGBA(50, 49, 48, 1)
                              HoverFill: =RGBA(245, 245, 245, 1)
                              Items: =Choices(Equipment_Tickets.Severity)
                              Items.Value: =Value
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =5
                              PaddingTop: =5
                              PressedBorderColor: =RGBA(16, 110, 190, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 120, 212, 1)
                              SelectionColor: =RGBA(50, 49, 48, 1)
                              SelectionFill: =RGBA(0, 120, 212, 1)
                              Width: =Parent.Width
                  - conTkStatus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        FillPortions: =0
                        Height: =76
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =If(Parent.Width < 720, Parent.Width - 28, (Parent.Width - 40) / 2)
                      Children:
                        - lblTkStatus:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
