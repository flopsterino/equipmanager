                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                              Y: =(Parent.Height - Self.Height) / 2
            - conTicketFooter:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =RGBA(250, 250, 250, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 760, 150, 76)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - lblTicketValidation:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(168, 0, 0, 1)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        Height: =Self.Size * 4.2
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =16
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: |-
                          =If(
                              IsBlank(If(varTicketAssetFixed, varTicketAsset, drpTkAsset.Selected.Value)),
                                  "Select the asset you are reporting on.",
                              IsBlank(Trim(txtTkDescription.Text)), "Describe the problem.",
                              ""
                          )
                        Width: =Parent.Width
                        X: =103
                  - btnResolveTicket:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(219, 219, 219, 1)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =1
                        Color: =RGBA(16, 124, 16, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(237, 247, 237, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Patch(
                              Equipment_Tickets,
                              // LookUp by ID, not the variable itself: a record carried in a global
                              // variable loses its schema, and Patch rejects it as "a Record value,
                              // but of a different schema".
                              LookUp(Equipment_Tickets, ID = varCurrentTicket.ID),
                              {
                                  ResolutionNotes: Trim(txtTkResolution.Text),
                                  ResolvedDate: Today(),
                                  // Save the status shown on screen as well, otherwise a
                                  // resolved issue keeps whatever status it had before.
                                  TicketStatus: { Value: drpTkStatus.Selected.Value },
                                  ResolvedBy: {
                                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                      Claims: "i:0#.f|membership|" & Lower(User().Email),
                                      DisplayName: User().FullName,
                                      Email: User().Email,
                                      Department: "",
                                      JobTitle: "",
                                      Picture: ""
                                  }
                              }
                          );
                          If(
                              IsEmpty(Errors(Equipment_Tickets)),
                              Notify("Issue marked as resolved.", NotificationType.Success);
                              Set(varCurrentTicket, Blank());
                              Navigate(scr_Tickets, ScreenTransition.Fade),
                              Notify(
                                  "Failed: " & Concat(Errors(Equipment_Tickets), Message, " | "),
                                  NotificationType.Error
                              )
                          )
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(16, 110, 190, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =13
                        Text: ="Mark as resolved"
                        Visible: =!varIsNewTicket
                        Width: =180
                  - btnSaveTicket:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(237, 235, 233, 1)
                        Fill: =RGBA(0, 120, 212, 1)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(16, 110, 190, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =If(
                              !IsBlank(lblTicketValidation.Text),
                                  Notify(lblTicketValidation.Text, NotificationType.Warning),
                              // Patch gets a literal record in each branch. Handing it a record bound
                              // with With() fails as "expecting a Record value, but of a different schema",
                              // and putting the If around Defaults() and an existing record instead unions
                              // two record types.
                              If(
                                  varIsNewTicket,
                                      Patch(
                                          Equipment_Tickets,
                                          Defaults(Equipment_Tickets),
                                          {
                                          Title:           If(varTicketAssetFixed, varTicketAsset, drpTkAsset.Selected.Value),
                                          TypeMaintenance: { Value: drpTkType.Selected.Value },
                                          Severity:        { Value: drpTkSeverity.Selected.Value },
                                          TicketStatus:    { Value: drpTkStatus.Selected.Value },
                                          Description:     Trim(txtTkDescription.Text),
                                          ReportedDate:    Now(),
                                          ReportedBy: {
                                              '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                              Claims: "i:0#.f|membership|" & Lower(User().Email),
                                              DisplayName: User().FullName,
                                              Email: User().Email,
                                              Department: "",
                                              JobTitle: "",
                                              Picture: ""
                                          }
                                          }
                                      ),
                                      Patch(
                                          Equipment_Tickets,
                                          // LookUp by ID, not the variable itself: a record carried in a global
                                          // variable loses its schema, and Patch rejects it as "a Record value,
                                          // but of a different schema".
                                          LookUp(Equipment_Tickets, ID = varCurrentTicket.ID),
                                          {
                                          Title:           If(varTicketAssetFixed, varTicketAsset, drpTkAsset.Selected.Value),
                                          TypeMaintenance: { Value: drpTkType.Selected.Value },
                                          Severity:        { Value: drpTkSeverity.Selected.Value },
                                          TicketStatus:    { Value: drpTkStatus.Selected.Value },
                                          // Who reported the issue and when are deliberately left alone
                                          // when an existing issue is edited. No trailing comma: a record
                                          // literal ending in one is a parse error, and a control whose
                                          // formula does not parse silently does nothing when tapped.
                                          Description:     Trim(txtTkDescription.Text)
                                          }
                                      )
                              );
                              If(
                                  IsEmpty(Errors(Equipment_Tickets)),
                                  Notify(
                                      If(varIsNewTicket, "Issue created.", "Issue updated."),
                                      NotificationType.Success
                                  );
                                  Set(varCurrentTicket, Blank());
                                  Navigate(scr_Tickets, ScreenTransition.Fade),
                                  Notify(
                                      "Save failed: " & Concat(Errors(Equipment_Tickets), Message, " | "),
                                      NotificationType.Error
                                  )
                              )
                          )
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(16, 110, 190, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =13
                        Text: =If(varIsNewTicket, "Submit issue", "Save")
                        Width: =170
