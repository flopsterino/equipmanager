Screens:
  scr_Bookings:
    Properties:
      Fill: RGBA(244, 245, 247, 1)
      LoadingSpinnerColor: =RGBA(0, 46, 101, 1)
      OnVisible: |-
        =If(IsBlank(varBookingView), Set(varBookingView, "calendar"));
        If(IsBlank(varCalMonth), Set(varCalMonth, Date(Year(Today()), Month(Today()), 1)));
        If(IsBlank(varCalDay), Set(varCalDay, Today()))
    Children:
      - conBookings:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - conBookingsHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 600, 110, 70)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - icoBookingsBack:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Back to home"
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(90, 101, 119, 1)
                        DisabledBorderColor: =RGBA(238, 241, 246, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =34
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(10, 74, 147, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.BackArrow
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Navigate(scr_Home, ScreenTransition.Fade)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(10, 74, 147, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Tooltip: ="Back"
                        Width: =34
                        X: =010
                        Y: =(Parent.Height - Self.Height) / 2
                  - lblBookingsTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(23, 35, 58, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Self.Size * 2.9
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =If(Parent.Width < 400, 16, If(Parent.Width < 600, 18, 20))
                        Text: ="Bookings"
                        Width: =Parent.Width
                        X: =103
                  - btnNewBooking:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(0, 46, 101, 1)
                        Font: =Font.'Segoe UI'
                        Height: =38
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(10, 74, 147, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Set(varCurrentBooking, Blank());
                          Set(varCurrentAsset, Blank());
                          Set(varCurrentSetup, Blank());
                          Navigate(scr_BookingDetail, ScreenTransition.Fade)
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(10, 74, 147, 1)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =12
                        Text: ="+ New booking"
                        Width: =If(Parent.Width < 600, Parent.Width - 16, 170)
            - conViewToggle:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - btnViewCalendar:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 46, 101, 1)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =1
                        Color: =If(varBookingView = "calendar", RGBA(255, 255, 255, 1), RGBA(0, 46, 101, 1))
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =If(varBookingView = "calendar", RGBA(0, 46, 101, 1), RGBA(255, 255, 255, 1))
                        Font: =Font.'Segoe UI'
                        Height: =34
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =If(varBookingView = "calendar", RGBA(10, 74, 147, 1), RGBA(232, 239, 248, 1))
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Set(varBookingView, "calendar")
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(10, 74, 147, 1)
                        RadiusBottomLeft: =17
                        RadiusBottomRight: =17
                        RadiusTopLeft: =17
                        RadiusTopRight: =17
                        Size: =12
                        Text: ="Calendar"
                        Width: =120
                  - btnViewList:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 46, 101, 1)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =1
                        Color: =If(varBookingView = "list", RGBA(255, 255, 255, 1), RGBA(0, 46, 101, 1))
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =If(varBookingView = "list", RGBA(0, 46, 101, 1), RGBA(255, 255, 255, 1))
                        Font: =Font.'Segoe UI'
                        Height: =34
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =If(varBookingView = "list", RGBA(10, 74, 147, 1), RGBA(232, 239, 248, 1))
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Set(varBookingView, "list")
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(10, 74, 147, 1)
                        RadiusBottomLeft: =17
                        RadiusBottomRight: =17
                        RadiusTopLeft: =17
                        RadiusTopRight: =17
                        Size: =12
                        Text: ="List"
                        Width: =100
            - conBookingDevice:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  FillPortions: =0
                  Height: |-
                    =If(
                        IsBlank(txtBkDeviceSearch.Text),
                        If(Parent.Width < 600, 178, 130),
                        If(Parent.Width < 600, 360, 320)
                    )
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - conBkDeviceField:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =If(IsBlank(txtBkDeviceSearch.Text), 118, 300)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =If(Parent.Width < 600, Parent.Width - 100, 380)
                      Children:
                        - lblBkDeviceCaption:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(90, 101, 119, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: ="DEVICE"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                              X: =103
                        - lblBkDeviceChosen:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: |-
                                =If(
                                    IsBlank(varBookingDevice),
                                    RGBA(139, 148, 163, 1),
                                    RGBA(23, 35, 58, 1)
                                )
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Fill: =RGBA(238, 241, 246, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Self.Size * 3.4
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =If(
                                    IsBlank(varBookingDevice),
                                    "Nothing chosen - type below to search",
                                    With(
                                        { a: LookUp(Equipment_Assets, Titel = varBookingDevice) },
                                        varBookingDevice & " - " & Coalesce(a.DeviceName, "?")
                                            & If(IsBlank(a.Manufacturer), "", "  (" & a.Manufacturer & ")")
                                    )
                                )
                              Width: =Parent.Width
                              X: =103
                        - txtBkDeviceSearch:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(211, 217, 226, 1)
                              Color: =RGBA(23, 35, 58, 1)
                              Default: =""
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Font: =Font.'Segoe UI'
                              HintText: =If(Parent.Width < 600, "Search ID, device, maker", "Type to search by ID, device or manufacturer")
                              HoverBorderColor: =RGBA(10, 74, 147, 1)
                              HoverColor: =RGBA(23, 35, 58, 1)
                              HoverFill: =RGBA(255, 255, 255, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PressedBorderColor: =RGBA(0, 46, 101, 1)
                              PressedColor: =RGBA(23, 35, 58, 1)
                              PressedFill: =RGBA(255, 255, 255, 1)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                              Y: =(Parent.Height - Self.Height) / 2
                        - galBkDeviceResults:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderColor: =RGBA(232, 236, 242, 1)
                              Height: =Parent.Height
                              Items: |-
                                =With(
                                    { q: Lower(Trim(txtBkDeviceSearch.Text)) },
                                    FirstN(
                                        Sort(
                                            Filter(
                                                Equipment_Assets,
                                                !IsBlank(Find(q, Lower(Coalesce(Titel, ""))))
                                                    || !IsBlank(Find(q, Lower(Coalesce(DeviceName, ""))))
                                                    || !IsBlank(Find(q, Lower(Coalesce(Manufacturer, ""))))
                                                    || !IsBlank(Find(q, Lower(Coalesce(SerialNumber, ""))))
                                            ),
                                            Titel
                                        ),
                                        25
                                    )
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              TemplateSize: =If(Parent.Width < 600, 84, 72)
                              Visible: =!IsBlank(txtBkDeviceSearch.Text)
                              Width: =Parent.Width
                            Children:
                              - lblBkDeviceRowName:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(23, 35, 58, 1)
                                    DisabledColor: =RGBA(139, 148, 163, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =If(Parent.TemplateWidth < 420, 58, 40)
                                    OnSelect: |-
                                      =Set(varBookingDevice, ThisItem.Titel);
                                      Reset(txtBkDeviceSearch)
                                    PaddingBottom: =0
                                    PaddingLeft: =8
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: |-
                                      =ThisItem.Titel & " - " & ThisItem.DeviceName &
                                      If(
                                          IsBlank(ThisItem.Manufacturer),
                                          "",
                                          "  (" & ThisItem.Manufacturer & ")"
                                      )
                                    Width: =Parent.TemplateWidth - 8
                                    X: =4
                                    Y: =4
                              - lblBkDeviceRowSub:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(90, 101, 119, 1)
                                    DisabledColor: =RGBA(139, 148, 163, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                                    Height: =18
                                    OnSelect: |-
                                      =Set(varBookingDevice, ThisItem.Titel);
                                      Reset(txtBkDeviceSearch)
                                    PaddingBottom: =0
                                    PaddingLeft: =8
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10
                                    Text: |-
                                      ="SN " & Coalesce(ThisItem.SerialNumber, "-") &
                                       "   |   " & Coalesce(ThisItem.CurrentCampus.Value, "?") &
                                       " / " & Coalesce(ThisItem.'CurrentLocation (CurrentLocation0)'.Value, "?") &
                                       "   |   " & Coalesce(ThisItem.Status.Value, "")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.TemplateWidth - 8
                                    Wrap: =false
                                    X: =4
                                    Y: =lblBkDeviceRowName.Y + lblBkDeviceRowName.Height
                              - recBkDeviceRowSep:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(232, 236, 242, 1)
                                    Height: =1
                                    OnSelect: |-
                                      =Set(varBookingDevice, ThisItem.Titel);
                                      Reset(txtBkDeviceSearch)
                                    # Always. This came from the browse template, where the rectangle is
                                    # the highlight on the selected row - so it only ever drew on one row.
                                    # Here it is a divider, a cell background or a colour strip, and it has
                                    # to be there on every row.
                                    Visible: =true
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - 1
                  - btnBkDeviceClear:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(211, 217, 226, 1)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(23, 35, 58, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        DisplayMode: |-
                          =If(
                              IsBlank(varBookingDevice)
                                  && IsEmpty(colGroupFilter),
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Fill: =RGBA(238, 241, 246, 1)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(230, 230, 230, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Set(varBookingDevice, "");
                          Reset(txtBkDeviceSearch);
                          Clear(colGroupFilter)
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(10, 74, 147, 1)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =12
                        Text: ="Clear"
                        Width: =80
                        Y: =18
            - conBookingGroups:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  FillPortions: =0
                  Height: |-
                    =18 + 8 + RoundUp(
                        CountRows(Choices(Equipment_Assets.OwnerGroup)) / If(Parent.Width < 600, 2, 4),
                        0
                    ) * 38
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - lblGroupChipsCaption:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(90, 101, 119, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        Text: |-
                          ="LAB GROUPS - OWNER OR USER" &
                           If(
                               IsEmpty(colGroupFilter),
                               "   (all)",
                               "   (" & CountRows(colGroupFilter) & " selected)"
                           )
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width
                        X: =103
                  - galGroupChips:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(255, 255, 255, 1)
                        Height: =Parent.Height
                        Items: =Sort(Choices(Equipment_Assets.OwnerGroup), Value)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        TemplateSize: =38
                        Width: =Parent.Width
                        WrapCount: =If(Parent.Width < 600, 2, 4)
                      Children:
                        - btnGroupChip:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 46, 101, 1)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =1
                              Color: |-
                                =If(
                                    ThisItem.Value in colGroupFilter.Value,
                                    RGBA(255, 255, 255, 1),
                                    RGBA(0, 46, 101, 1)
                                )
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Fill: |-
                                =If(
                                    ThisItem.Value in colGroupFilter.Value,
                                    RGBA(0, 46, 101, 1),
                                    RGBA(255, 255, 255, 1)
                                )
                              Font: =Font.'Segoe UI'
                              Height: =32
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: |-
                                =If(
                                    ThisItem.Value in colGroupFilter.Value,
                                    RGBA(10, 74, 147, 1),
                                    RGBA(232, 239, 248, 1)
                                )
                              OnSelect: |-
                                =If(
                                    ThisItem.Value in colGroupFilter.Value,
                                    Remove(
                                        colGroupFilter,
                                        LookUp(colGroupFilter, Value = ThisItem.Value)
                                    ),
                                    Collect(colGroupFilter, { Value: ThisItem.Value })
                                )
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(10, 74, 147, 1)
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              Size: =11
                              Text: =ThisItem.Value
                              Width: =Parent.TemplateWidth - 8
                              X: =4
                              Y: =3
            - conMonthNav:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =6
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Visible: =varBookingView = "calendar"
                  Width: =Parent.Width
                Children:
                  - icoPrevMonth:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Previous month"
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(0, 46, 101, 1)
                        DisabledBorderColor: =RGBA(238, 241, 246, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =30
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(10, 74, 147, 1)
                        HoverFill: =RGBA(232, 239, 248, 1)
                        Icon: =Icon.ChevronLeft
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Set(varCalMonth, DateAdd(varCalMonth, -1, TimeUnit.Months))
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(10, 74, 147, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Tooltip: ="Previous month"
                        Width: =34
                        X: =010
                        Y: =(Parent.Height - Self.Height) / 2
                  - lblCalMonth:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(23, 35, 58, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =Text(varCalMonth, "mmmm yyyy")
                        Width: =Parent.Width
                        X: =103
                  - icoNextMonth:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Next month"
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(0, 46, 101, 1)
                        DisabledBorderColor: =RGBA(238, 241, 246, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =30
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(10, 74, 147, 1)
                        HoverFill: =RGBA(232, 239, 248, 1)
                        Icon: =Icon.ChevronRight
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Set(varCalMonth, DateAdd(varCalMonth, 1, TimeUnit.Months))
