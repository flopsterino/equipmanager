Screens:
  scr_Move:
    Properties:
      Fill: RGBA(244, 245, 247, 1)
      LoadingSpinnerColor: =RGBA(0, 46, 101, 1)
    Children:
      - ScreenContainerMove:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - HeaderContainerMove:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  FillPortions: =0
                  Height: =100
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - icoBack:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Back to home screen"
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(90, 101, 119, 1)
                        DisabledBorderColor: =RGBA(238, 241, 246, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =40
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(10, 74, 147, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.BackArrow
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Reset(txtMoveSearch);
                          Navigate(scr_Home, ScreenTransition.Fade)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(10, 74, 147, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Tooltip: ="Back"
                        Width: =40
                        X: =010
                        Y: =(Parent.Height - Self.Height) / 2
                  - txtMoveSearch:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(211, 217, 226, 1)
                        Color: =RGBA(23, 35, 58, 1)
                        Default: =""
                        DelayOutput: =true
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        Height: =44
                        HintText: =If(Parent.Width < 600, "Search ID, serial, device or setup", "Search by Asset ID, UA number, serial, device, manufacturer or Setup ID")
                        HoverBorderColor: =RGBA(10, 74, 147, 1)
                        HoverColor: =RGBA(23, 35, 58, 1)
                        HoverFill: =RGBA(255, 255, 255, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =RGBA(0, 46, 101, 1)
                        PressedColor: =RGBA(23, 35, 58, 1)
                        PressedFill: =RGBA(255, 255, 255, 1)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =14
                        Width: =Parent.Width - Self.X - 130
                        Y: =(Parent.Height - Self.Height) / 2
                  - BarcodeReader2:
                      Control: BarcodeReader@1.0.25
                      Properties:
                        FillColor: =RGBA(0, 46, 101, 1)
                        FontSize: =14
                        Height: =60
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnScan: |-
                          =Set(varScanCode, Trim(First(Self.Barcodes).Value));
                          Set(
                              varScanAsset,
                              LookUp(
                                  Equipment_Assets,
                                  Titel = varScanCode || UANumber = varScanCode || SerialNumber = varScanCode
                              )
                          );
                          Set(varScanSetup, LookUp(Equipment_Setups, Titel = varScanCode));
                          Set(
                              varScanSetupNew,
                              Filter(
                                  Filter(Equipment_Assets, varScanCode in Setups.Value),
                                  Not('Id (ID)' in colMoveBuffer.'Id (ID)')
                              )
                          );
                          If(
                              // 1. An individual asset, already queued
                              !IsBlank(varScanAsset.'Id (ID)') && varScanAsset.'Id (ID)' in colMoveBuffer.'Id (ID)',
                              Notify(
                                  "Asset " & varScanCode & " is already in the move list.",
                                  NotificationType.Warning
                              ),
                              !IsBlank(varScanAsset.'Id (ID)'),
                              Collect(colMoveBuffer, varScanAsset);
                              Notify("Asset " & varScanCode & " added.", NotificationType.Success),
                              // 2. No asset, so try a setup: Equipment_Setups.Title is the SetupID
                              !IsBlank(varScanSetup.'Id (ID)'),
                              Collect(colMoveBuffer, varScanSetupNew);
                              Notify(
                                  "Setup " & varScanCode & " and all linked assets added.",
                                  NotificationType.Success
                              ),
                              // 3. Nothing found
                              Notify(
                                  "Code " & varScanCode & " not found in assets or setups.",
                                  NotificationType.Error
                              )
                          )
                        ScanningMode: ='BarcodeReader.ScanningMode'.AutomaticallyScan
                        Text: ="Scan"
                        Width: =140
                        X: =Parent.Width - Self.Width - 10
                        Y: =(Parent.Height - Self.Height) / 2
            - BufferBarContainer:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - lblBufferCount:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(23, 35, 58, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Self.Size * 4.2
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: |-
                          =If(
                              IsEmpty(colMoveBuffer),
                              "No items selected yet",
                              CountRows(colMoveBuffer) & If(CountRows(colMoveBuffer) = 1, " item", " items") & " ready to move"
                          )
                        Width: =Parent.Width
                        X: =103
                  - btnClearBuffer:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(211, 217, 226, 1)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =1
                        Color: =RGBA(90, 101, 119, 1)
                        DisabledBorderColor: =RGBA(232, 236, 242, 1)
                        DisabledColor: =RGBA(203, 210, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        DisplayMode: =If(IsEmpty(colMoveBuffer), DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =32
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(163, 18, 28, 1)
                        HoverFill: =RGBA(253, 231, 233, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Clear(colMoveBuffer)
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(10, 74, 147, 1)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =12
                        Text: ="Clear list"
                        Width: =130
            - GalleryContainerMove:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - galMoveItems:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(238, 241, 246, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =Parent.Height - 16
                        Items: =colMoveBuffer
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        TemplateSize: =If(Parent.Width < 600, 90, 72)
                        Width: =Parent.Width - 16
                      Children:
                        - lblBufTitle:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(23, 35, 58, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =If(Parent.TemplateWidth < 600, 38, 24)
                              PaddingBottom: =0
                              PaddingLeft: =4
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: |-
                                =ThisItem.Titel & " - " & ThisItem.DeviceName &
                                If(
                                    IsBlank(ThisItem.Manufacturer),
                                    "",
                                    "  (" & ThisItem.Manufacturer & ")"
                                )
                              Width: =Parent.TemplateWidth - 80
                              X: =16
                              Y: =12
                        - lblBufSubtitle:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(90, 101, 119, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =4
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: |-
                                ="Now: " & Coalesce(ThisItem.CurrentCampus.Value, "?") & " / " & Coalesce(ThisItem.'CurrentLocation (CurrentLocation0)'.Value, "?") &
                                 If(
                                     IsEmpty(ThisItem.Setups),
                                     "",
                                     "   |   Setup: " & Concat(ThisItem.Setups, Value, ", ")
                                 )
                              Width: =Parent.TemplateWidth - 80
                              Wrap: =false
                              X: =16
                              Y: =lblBufTitle.Y + lblBufTitle.Height
                        - icoRemoveFromBuffer:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: ="Remove this item from the move list"
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(139, 148, 163, 1)
                              DisabledBorderColor: =RGBA(238, 241, 246, 1)
                              DisabledColor: =RGBA(225, 223, 221, 1)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =24
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(163, 18, 28, 1)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Icon: =Icon.Trash
                              OnSelect: =Remove(colMoveBuffer, ThisItem)
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(10, 74, 147, 1)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Tooltip: ="Remove"
                              Width: =24
                              X: =Parent.TemplateWidth - Self.Width - 20
                              Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                        - recBufSeparator:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(233, 237, 243, 1)
                              Height: =1
                              Visible: =ThisItem.IsSelected
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 1
            - FooterContainerMove:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =RGBA(244, 245, 247, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 760, 190, 88)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - drpTargetLocation:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        BorderColor: =RGBA(211, 217, 226, 1)
                        ChevronBackground: =RGBA(238, 241, 246, 1)
                        ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                        ChevronDisabledFill: =RGBA(139, 148, 163, 1)
                        ChevronFill: =RGBA(23, 35, 58, 1)
                        ChevronHoverBackground: =RGBA(238, 241, 246, 1)
                        ChevronHoverFill: =RGBA(23, 35, 58, 1)
                        Color: =RGBA(23, 35, 58, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        HoverBorderColor: =RGBA(10, 74, 147, 1)
                        HoverColor: =RGBA(23, 35, 58, 1)
                        HoverFill: =RGBA(255, 255, 255, 1)
                        Items: =Choices(Equipment_Assets.'CurrentLocation (CurrentLocation0)')
                        Items.Value: =Value
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedBorderColor: =RGBA(10, 74, 147, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 46, 101, 1)
                        SelectionColor: =RGBA(23, 35, 58, 1)
                        SelectionFill: =RGBA(0, 46, 101, 1)
                        Width: =If(Parent.Width < 760, Parent.Width - 32, 220)
                  - lblDerivedCampusValue:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(23, 35, 58, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Font: =Font.'Segoe UI'
                        Height: =1
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: |-
                          =Coalesce(
                              LookUp(
                                  Equipment_Assets,
                                  'CurrentLocation (CurrentLocation0)'.Value = drpTargetLocation.Selected.Value
                              ).CurrentCampus.Value,
                              LookUp(
                                  Equipment_Setups,
                                  CurrentLocation.Value = drpTargetLocation.Selected.Value
                              ).CurrentCampus.Value,
                              ""
                          )
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =false
                        Width: =1
                        X: =103
                  - lblRoomListProblem:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(23, 35, 58, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Font: =Font.'Segoe UI'
                        Height: =1
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: |-
                          =With(
                              {
                                  room: drpTargetLocation.Selected.Value,
                                  campus: lblDerivedCampusValue.Text,
                                  movingASetup: !IsEmpty(Filter(colMoveBuffer, !IsEmpty(Setups)))
                              },
                              If(
                                  IsBlank(room),
                                      "",
                                  IsBlank(
                                      LookUp(
                                          Choices(Equipment_MovementLog.ToLocation),
                                          Value = room
                                      ).Value
                                  ),
                                      "the movement log, ToLocation",
                                  !IsEmpty(
                                      Filter(
                                          Distinct(colMoveBuffer, 'CurrentLocation (CurrentLocation0)'.Value) As src,
                                          IsBlank(
                                              LookUp(
                                                  Choices(Equipment_MovementLog.FromLocation),
                                                  Value = src.Value
                                              ).Value
                                          )
                                      )
                                  ),
                                      "the movement log, FromLocation - a room one of these assets is in now",
                                  movingASetup && IsBlank(
                                      LookUp(
                                          Choices(Equipment_Setups.CurrentLocation),
                                          Value = room
                                      ).Value
                                  ),
                                      "the setups list, CurrentLocation",
                                  movingASetup && !IsBlank(campus) && IsBlank(
                                      LookUp(
                                          Choices(Equipment_Setups.CurrentCampus),
                                          Value = campus
                                      ).Value
                                  ),
                                      "the setups list, CurrentCampus",
                                  ""
                              )
                          )
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =false
                        Width: =1
                        X: =103
                  - lblMoveBlocker:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(23, 35, 58, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Font: =Font.'Segoe UI'
                        Height: =1
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: |-
                          =If(
                              IsEmpty(colMoveBuffer),
                                  "Add at least one asset or setup to the move list first.",
                              IsBlank(drpTargetLocation.Selected.Value),
                                  "Choose the room to move to.",
                              !IsBlank(lblRoomListProblem.Text),
                                  "Cannot record this move: a value is missing from "
                                      & lblRoomListProblem.Text & ". Add it there first.",
                              ""
                          )
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =false
                        Width: =1
                        X: =103
                  - lblDerivedCampus:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: |-
                          =If(
                              !IsBlank(lblRoomListProblem.Text),
                              RGBA(163, 18, 28, 1),
                              IsBlank(lblDerivedCampusValue.Text),
                                  RGBA(139, 148, 163, 1),
                              RGBA(90, 101, 119, 1)
                          )
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: |-
                          =If(
                              IsBlank(drpTargetLocation.Selected.Value),
                              "",
                              !IsBlank(lblRoomListProblem.Text),
                                  "Cannot record this move: a value is missing from " & lblRoomListProblem.Text & ". Add it there first.",
                              IsBlank(lblDerivedCampusValue.Text),
                                  "Campus unknown for this room, stays unchanged",
                              "Campus will be " & lblDerivedCampusValue.Text
                          )
                        Width: =If(Parent.Width < 760, Parent.Width - 32, 230)
                        X: =103
                  - btnConfirmMove:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        DisabledFill: =RGBA(233, 237, 243, 1)
                        Fill: =RGBA(0, 46, 101, 1)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(10, 74, 147, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Set(varMvBlocked, !IsBlank(lblMoveBlocker.Text));
                          Set(varMvRoom, drpTargetLocation.Selected.Value);
                          Set(varMvCampus, lblDerivedCampusValue.Text);
                          Set(varMvAction, If(CountRows(colMoveBuffer) > 1, "Bulk Move", "Relocation"));
                          If(
                              varMvBlocked,
                              Notify(lblMoveBlocker.Text, NotificationType.Warning),

                              Notify(
                                  "Moving " & CountRows(colMoveBuffer) & " item(s) to " & varMvRoom & "...",
                                  NotificationType.Information
                              );

                              // 1. Log first: FromLocation has to hold the OLD room.
                              ForAll(
                                  colMoveBuffer As buffered,
                                  Patch(
                                      Equipment_MovementLog,
                                      Defaults(Equipment_MovementLog),
                                      {
                                          Title: buffered.Titel,
                                          FromLocation: { Value: buffered.'CurrentLocation (CurrentLocation0)'.Value },
                                          ToLocation: { Value: varMvRoom },
                                          MovedBy: {
                                              '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                              Claims: "i:0#.f|membership|" & Lower(User().Email),
                                              DisplayName: User().FullName,
                                              Email: User().Email,
                                              Department: "",
                                              JobTitle: "",
                                              Picture: ""
                                          },
                                          ActionType: { Value: varMvAction },
                                          TimeStamp: Now()
                                      }
                                  )
                              );

                              // 2. Then the assets. LookUp by ID hands Patch a real Equipment_Assets
                              //    record; the buffered row comes from a collection whose schema is
                              //    merged from several Collect() calls.
                              ForAll(
                                  colMoveBuffer As buffered,
                                  Patch(
                                      Equipment_Assets,
                                      LookUp(Equipment_Assets, 'Id (ID)' = buffered.'Id (ID)'),
                                      {
                                          'CurrentLocation (CurrentLocation0)': { Value: varMvRoom },
                                          CurrentCampus: {
                                              Value: Coalesce(varMvCampus, buffered.CurrentCampus.Value)
                                          },
                                          LastRelocatedBy: {
                                              '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                              Claims: "i:0#.f|membership|" & Lower(User().Email),
                                              DisplayName: User().FullName,
                                              Email: User().Email,
                                              Department: "",
                                              JobTitle: "",
                                              Picture: ""
                                          },
                                          LastUpdated: Now()
                                      }
                                  )
                              );

                              // 3. A setup that came along would otherwise still point at the old room.
                              ForAll(
                                  // Each queued asset carries a table of setups, so they are
                                  // flattened into one list of titles before being deduplicated.
                                  Distinct(
                                      Ungroup(
                                          ForAll(colMoveBuffer As a, { setups: a.Setups }),
                                          setups),
                                      Value
                                  ) As s,
                                  If(
                                      !IsBlank(LookUp(Equipment_Setups, Titel = s.Value).'Id (ID)'),
                                      Patch(
                                          Equipment_Setups,
                                          LookUp(Equipment_Setups, Titel = s.Value),
                                          {
                                              CurrentLocation: { Value: varMvRoom },
                                              CurrentCampus: {
                                                  Value: Coalesce(
                                                      varMvCampus,
                                                      LookUp(Equipment_Setups, Titel = s.Value).CurrentCampus.Value
                                                  )
                                              }
                                          }
                                      )
                                  )
                              );

                              // 4. Say what happened, either way.
                              Set(
                                  varMvOk,
                                  IsEmpty(Errors(Equipment_Assets))
                                      && IsEmpty(Errors(Equipment_MovementLog))
                                      && IsEmpty(Errors(Equipment_Setups))
                              );
                              If(
                                  varMvOk,
                                  Clear(colMoveBuffer);
                                  Reset(drpTargetLocation);
                                  Notify("Move saved.", NotificationType.Success),
                                  Notify(
                                      "Save failed: " & Trim(
                                          Concat(Errors(Equipment_Assets), Message, " | ") & " " &
                                          Concat(Errors(Equipment_MovementLog), Message, " | ") & " " &
                                          Concat(Errors(Equipment_Setups), Message, " | ")
                                      ),
                                      NotificationType.Error
                                  )
                              )
                          )
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 69, 120, 1)
