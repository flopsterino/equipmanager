            - galCalendar:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =RGBA(232, 236, 242, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 600, 318, 372)
                  Items: |-
                    =With(
                        {
                            first: DateAdd(
                                varCalMonth,
                                -(Weekday(varCalMonth, StartOfWeek.Monday) - 1),
                                TimeUnit.Days
                            )
                        },
                        ForAll(
                            Sequence(42) As s,
                            With(
                                { d: DateAdd(first, s.Value - 1, TimeUnit.Days) },
                                {
                                    CellDate: d,
                                    DayNum: Day(d),
                                    InMonth: Month(d) = Month(varCalMonth),
                                    Bookings: CountRows(
                                        Filter(
                                            Equipment_Bookings As bk,
                                            bk.StartDate <= d,
                                            bk.EndDate >= d,
                                            IsBlank(varBookingDevice)
                                                || bk.Title = varBookingDevice,
                                            IsEmpty(colGroupFilter)
                                                || LookUp(Equipment_Assets, Titel = bk.Title).OwnerGroup.Value in colGroupFilter.Value
                                                || LookUp(Equipment_Assets, Titel = bk.Title).UserGroup.Value in colGroupFilter.Value
                                        )
                                    )
                                }
                            )
                        )
                    )
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  ShowScrollbar: =false
                  TemplateSize: =If(Parent.Width < 600, 52, 61)
                  Visible: =varBookingView = "calendar"
                  Width: =Parent.Width - 16
                  WrapCount: =7
                Children:
