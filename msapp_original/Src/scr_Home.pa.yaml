Screens:
  scr_Home:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: =If(IsBlank(varHomeTab), Set(varHomeTab, "assets"))
    Children:
      - ScreenContainer1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - HeaderContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  FillPortions: =0
                  Height: =If(Parent.Width < 600, 118, 76)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - AppName:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Self.Size * 2.9
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =If(Parent.Width < 400, 16, If(Parent.Width < 600, 18, 20))
                        Text: ="Lab Equipment Hub"
                        Width: =Parent.Width
                        X: =103
                  - btnNewAsset:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(0, 120, 212, 1)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(16, 110, 190, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =If(
                              varHomeTab = "setups",
                              Set(varEditSetup, Blank());
                              Navigate(scr_SetupEdit, ScreenTransition.Fade),
                              Set(varEditAsset, Blank());
                              Navigate(scr_AssetEdit, ScreenTransition.Fade)
                          )
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(16, 110, 190, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =12
                        Text: =If(varHomeTab = "setups", "+ New setup", "+ New asset")
                        Width: =If(Parent.Width < 600, (Parent.Width - 42) / 2, 150)
                  - BarcodeReader1:
                      Control: BarcodeReader@1.0.25
                      Properties:
                        FillColor: =RGBA(0, 120, 212, 1)
                        FontSize: =12
                        Height: =40
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnScan: |-
                          =Set(varScanCode, Trim(First(Self.Barcodes).Value));
                          Set(
                              varScanAsset,
                              LookUp(
                                  Equipment_Assets,
                                  Titel = varScanCode || SerialNumber = varScanCode || UANumber = varScanCode
                              )
                          );
                          Set(varScanSetup, LookUp(Equipment_Setups, Titel = varScanCode));
                          If(
                              !IsBlank(varScanAsset.'Id (ID)'),
                              Set(varCurrentAsset, varScanAsset);
                              Navigate(scr_AssetDetail, ScreenTransition.Fade),
                              !IsBlank(varScanSetup.'Id (ID)'),
                              Set(varCurrentSetup, varScanSetup);
                              Navigate(scr_SetupDetail, ScreenTransition.Fade),
                              Notify(
                                  "Code " & varScanCode & " not found in assets or setups.",
                                  NotificationType.Warning
                              )
                          )
                        ScanningMode: ='BarcodeReader.ScanningMode'.AutomaticallyScan
                        Text: ="Scan"
                        Width: =If(Parent.Width < 600, (Parent.Width - 42) / 2, 130)
                        X: =Parent.Width - Self.Width - 10
                        Y: =(Parent.Height - Self.Height) / 2
            - conSearchRow:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - txtSearch:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(219, 219, 219, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: =""
                        DelayOutput: =true
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        HintText: |-
                          =If(
                              Parent.Width < 600,
                              "Search",
                              "Search by ID, serial number, name or manufacturer"
                          )
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(255, 255, 255, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =RGBA(0, 120, 212, 1)
                        PressedColor: =RGBA(50, 49, 48, 1)
                        PressedFill: =RGBA(255, 255, 255, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Width: =Parent.Width - Self.X - 130
                        Y: =(Parent.Height - Self.Height) / 2
                  - btnFilters:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 120, 212, 1)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =1
                        Color: =If(varShowFilters, RGBA(255, 255, 255, 1), RGBA(0, 120, 212, 1))
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =If(varShowFilters, RGBA(0, 120, 212, 1), RGBA(255, 255, 255, 1))
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =If(varShowFilters, RGBA(16, 110, 190, 1), RGBA(235, 243, 252, 1))
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Set(varShowFilters, !varShowFilters)
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(16, 110, 190, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =12
                        Text: |-
                          ="Filters" &
                           With(
                               { n:
                                   If(IsBlank(drpFilterCampus.Selected.Value)
                                          || drpFilterCampus.Selected.Value = "All campuses", 0, 1) +
                                   If(IsBlank(drpFilterLocation.Selected.Value)
                                          || drpFilterLocation.Selected.Value = "All rooms", 0, 1) +
                                   If(IsBlank(drpFilterOwner.Selected.Value)
                                          || drpFilterOwner.Selected.Value = "All research groups", 0, 1) +
                                   If(IsBlank(drpFilterStatus.Selected.Value)
                                          || drpFilterStatus.Selected.Value = "All statuses", 0, 1)
                               },
                               If(n = 0, "", " (" & n & ")")
                           )
                        Width: =110
            - conFilters:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =RGBA(250, 250, 250, 1)
                  FillPortions: =0
                  Height: |-
                    =If(
                        Parent.Width < 640, 316,
                        Parent.Width < 1100, 180,
                        112
                    )
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =8
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =varShowFilters
                  Width: =Parent.Width - 16
                Children:
                  - conFltCampus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: |-
                          =If(
                              Parent.Width < 640, Parent.Width - 24,
                              Parent.Width < 1100, (Parent.Width - 34) / 2,
                              (Parent.Width - 54) / 4
                          )
                      Children:
                        - lblFltCampus:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(96, 94, 92, 1)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =10
                              Text: ="CAMPUS"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                              X: =103
                        - drpFilterCampus:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              BorderColor: =RGBA(219, 219, 219, 1)
                              ChevronBackground: =RGBA(245, 245, 245, 1)
                              ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                              ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                              ChevronFill: =RGBA(50, 49, 48, 1)
                              ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                              ChevronHoverFill: =RGBA(50, 49, 48, 1)
                              Color: =RGBA(50, 49, 48, 1)
                              Default: ="All campuses"
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Font: =Font.'Segoe UI'
                              HoverBorderColor: =RGBA(16, 110, 190, 1)
                              HoverColor: =RGBA(50, 49, 48, 1)
                              HoverFill: =RGBA(245, 245, 245, 1)
                              Items: |-
                                =Ungroup(
                                    Table(
                                        { opt: Table({ Value: "All campuses" }) },
                                        { opt: ForAll(Choices(Equipment_Assets.CurrentCampus) As c, { Value: c.Value }) }
                                    ),
                                    opt
                                )
                              Items.Value: =Value
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              PressedBorderColor: =RGBA(16, 110, 190, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 120, 212, 1)
                              SelectionColor: =RGBA(50, 49, 48, 1)
                              SelectionFill: =RGBA(0, 120, 212, 1)
                              Width: =Parent.Width
                  - conFltRoom:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: |-
                          =If(
                              Parent.Width < 640, Parent.Width - 24,
                              Parent.Width < 1100, (Parent.Width - 34) / 2,
                              (Parent.Width - 54) / 4
                          )
                      Children:
                        - lblFltRoom:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(96, 94, 92, 1)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =20
