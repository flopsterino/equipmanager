                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(219, 219, 219, 1)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =1
                              Color: =RGBA(96, 94, 92, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              DisplayMode: =If(IsBlank(varSetupHolder.Mail), DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              Height: =30
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(16, 110, 190, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =Set(varSetupHolder, { DisplayName: "", Mail: "" })
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(16, 110, 190, 1)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Size: =11
                              Text: ="Clear responsible person"
                              Width: =Parent.Width
            - conSeFooter:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =RGBA(250, 250, 250, 1)
                  FillPortions: =0
                  Height: =76
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - lblSeValidation:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(168, 0, 0, 1)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        Height: =Self.Size * 4.2
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =16
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: |-
                          =If(
                              IsBlank(Trim(txtSetupId.Text)), "Setup ID is required.",
                              varIsNewSetup && !IsBlank(LookUp(Equipment_Setups, Titel = Trim(txtSetupId.Text)).'Id (ID)'),
                                  "Setup ID " & Trim(txtSetupId.Text) & " already exists.",
                              ""
                          )
                        Width: =Parent.Width
                        X: =103
                  - btnSaveSetup:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(237, 235, 233, 1)
                        DisplayMode: =If(IsBlank(lblSeValidation.Text), DisplayMode.Edit, DisplayMode.Disabled)
                        Fill: =RGBA(0, 120, 212, 1)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(16, 110, 190, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =// Patch gets a literal record in each branch. Handing it a record bound
                          // with With() fails as "expecting a Record value, but of a different schema",
                          // and putting the If around Defaults() and an existing record instead unions
                          // two record types.
                          Set(
                              varSavedSetup,
                              If(
                                  varIsNewSetup,
                                  Patch(
                                      Equipment_Setups,
                                      Defaults(Equipment_Setups),
                                      {
                                      Titel:           Trim(txtSetupId.Text),
                                      SetupName:       Trim(txtSetupName.Text),
                                      CurrentCampus:   { Value: drpSetupCampus.Selected.Value },
                                      CurrentLocation: { Value: drpSetupRoom.Selected.Value },
                                      Status:          { Value: drpSetupStatus.Selected.Value },
                                      Description:     Trim(txtSetupDesc.Text)
                                      }
                                  ),
                                  Patch(
                                      Equipment_Setups,
                                      // LookUp by ID, not the variable itself: a record carried in a global
                                      // variable loses its schema, and Patch rejects it as "a Record value,
                                      // but of a different schema".
                                      LookUp(Equipment_Setups, 'Id (ID)' = varEditSetup.'Id (ID)'),
                                      {
                                      SetupName:       Trim(txtSetupName.Text),
                                      CurrentCampus:   { Value: drpSetupCampus.Selected.Value },
                                      CurrentLocation: { Value: drpSetupRoom.Selected.Value },
                                      Status:          { Value: drpSetupStatus.Selected.Value },
                                      Description:     Trim(txtSetupDesc.Text)
                                      }
                                  )
                              )
                          );

                          // Person field separately, so an empty pick does not clear the existing value.
                          If(
                              !IsBlank(varSetupHolder.Mail) && !IsBlank(varSavedSetup.'Id (ID)'),
                              Patch(
                                  Equipment_Setups,
                                  LookUp(Equipment_Setups, 'Id (ID)' = varSavedSetup.'Id (ID)'),
                                  {
                                      ResponsiblePerson: {
                                          '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                          Claims: "i:0#.f|membership|" & Lower(varSetupHolder.Mail),
                                          DisplayName: varSetupHolder.DisplayName,
                                          Email: varSetupHolder.Mail,
                                          Department: "",
                                          JobTitle: "",
                                          Picture: ""
                                      }
                                  }
                              )
                          );

                          If(
                              IsEmpty(Errors(Equipment_Setups)),
                              Notify(
                                  If(varIsNewSetup, "Setup added. Add its assets below.", "Changes saved."),
                                  NotificationType.Success
                              );
                              Set(varCurrentSetup, LookUp(Equipment_Setups, 'Id (ID)' = varSavedSetup.'Id (ID)'));
                              Set(varEditSetup, Blank());
                              Navigate(scr_SetupDetail, ScreenTransition.Fade),
                              Notify(
                                  "Save failed: " & Concat(Errors(Equipment_Setups), Message, " | "),
                                  NotificationType.Error
                              )
                          )
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(16, 110, 190, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =13
                        Text: =If(varIsNewSetup, "Add setup", "Save")
                        Width: =190
