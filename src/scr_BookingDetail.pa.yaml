Screens:
  scr_BookingDetail:
    Properties:
      Fill: RGBA(244, 245, 247, 1)
      LoadingSpinnerColor: =RGBA(0, 46, 101, 1)
      OnVisible: |-
        =Set(varIsNewBooking, IsBlank(varCurrentBooking.ID));
        Set(varBkStart, Coalesce(varCurrentBooking.StartDate, Today()));
        Set(varBkEnd, Coalesce(varCurrentBooking.EndDate, Today()));
        Set(varPickTarget, "");
        // A booking can cover several devices, so the choice is a collection, not a
        // variable. An existing booking is one row and therefore one device; a new one
        // starts from the asset we came from, if any.
        Set(varBkSeed, Coalesce(varCurrentBooking.Title, varCurrentAsset.Titel, ""));
        Clear(colBkAssets);
        If(
            !IsBlank(varBkSeed),
            Collect(
                colBkAssets,
                {
                    Id: LookUp(Equipment_Assets, Titel = varBkSeed).'Id (ID)',
                    Value: varBkSeed
                }
            )
        );
        Set(varPickMonth, Date(Year(varBkStart), Month(varBkStart), 1))
    Children:
      - conBooking:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - conBookingHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =70
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - icoBookingBack:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Back"
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(90, 101, 119, 1)
                        DisabledBorderColor: =RGBA(238, 241, 246, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =34
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(10, 74, 147, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.BackArrow
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Back(ScreenTransition.Fade)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(10, 74, 147, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Tooltip: ="Back"
                        Width: =34
                        X: =010
                        Y: =(Parent.Height - Self.Height) / 2
                  - lblBookingTitle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(23, 35, 58, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Self.Size * 2.9
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =If(Parent.Width < 400, 16, If(Parent.Width < 600, 18, 20))
                        Text: =If(varIsNewBooking, "New booking", "Edit booking")
                        Width: =Parent.Width
                        X: =103
            - conBookingBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =14
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - lblBkConflictCount:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(23, 35, 58, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Font: =Font.'Segoe UI'
                        Height: =1
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =CountRows(galConflicts.AllItems) & ""
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =false
                        Width: =1
                        X: =103
                  - lblBkIssueCount:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(23, 35, 58, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Font: =Font.'Segoe UI'
                        Height: =1
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: |-
                          =CountRows(
                              Filter(
                                  Equipment_Tickets,
                                  Title in colBkAssets.Value,
                                  IsBlank(ResolvedDate)
                              )
                          ) & ""
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =false
                        Width: =1
                        X: =103
                  - lblBkWarnBooked:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(138, 75, 0, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Fill: =RGBA(255, 244, 224, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Self.Size * 4.2
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =0
                        Size: =12
                        Text: |-
                          ="Already booked. " & lblBkConflictCount.Text &
                           " other booking(s) overlap this period - see the list at the bottom of this form."
                        Visible: =Value(lblBkConflictCount.Text) > 0
                        Width: =Parent.Width - 24
                        X: =103
                  - lblBkWarnIssue:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(138, 75, 0, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Fill: =RGBA(255, 244, 224, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Self.Size * 4.2
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =0
                        Size: =12
                        Text: |-
                          ="Open issue: " & lblBkIssueCount.Text &
                           " unresolved report(s) on the device(s) in this booking."
                        Visible: =Value(lblBkIssueCount.Text) > 0
                        Width: =Parent.Width - 24
                        X: =103
                  - conBkAssetField:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: |-
                          =22 + 40 + 8 +
                          If(
                              IsEmpty(colBkAssets),
                              35,
                              RoundUp(CountRows(colBkAssets) / If(Parent.Width < 600, 1, 2), 0) * 34
                          ) +
                          If(IsBlank(txtBkAssetSearch.Text), 0, 190)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =If(Parent.Width < 720, Parent.Width - 28, (Parent.Width - 40) / 2)
                      Children:
                        - lblBkAssetCaption:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(90, 101, 119, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: ="ASSET *"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                              X: =103
                        - galBkAssetsChosen:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderColor: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: |-
                                =If(
                                    IsEmpty(colBkAssets),
                                    0,
                                    RoundUp(
                                        CountRows(colBkAssets) / If(Parent.Width < 600, 1, 2),
                                        0
                                    ) * 34
                                )
                              Items: =colBkAssets
                              LayoutMinHeight: =0
                              LayoutMinWidth: =16
                              ShowScrollbar: =false
                              TemplateSize: =34
                              Visible: =!IsEmpty(colBkAssets)
                              Width: =Parent.Width
                              WrapCount: =If(Parent.Width < 600, 1, 2)
                            Children:
                              - btnBkAssetChip:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(0, 46, 101, 1)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =1
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(139, 148, 163, 1)
                                    DisabledFill: =RGBA(242, 242, 241, 0)
                                    Fill: =RGBA(0, 46, 101, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =28
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =RGBA(163, 18, 28, 1)
                                    OnSelect: =Remove(colBkAssets, LookUp(colBkAssets, Value = ThisItem.Value))
                                    PressedBorderColor: =RGBA(0, 69, 120, 1)
                                    PressedColor: =RGBA(255, 255, 255, 1)
                                    PressedFill: =RGBA(10, 74, 147, 1)
                                    RadiusBottomLeft: =14
                                    RadiusBottomRight: =14
                                    RadiusTopLeft: =14
                                    RadiusTopRight: =14
                                    Size: =10
                                    Text: |-
                                      =ThisItem.Value & " - " &
                                       Coalesce(
                                           LookUp(Equipment_Assets, Titel = ThisItem.Value).DeviceName,
                                           "?"
                                       ) & "   x"
                                    Tooltip: ="Remove from this booking"
                                    Width: =Parent.TemplateWidth - 8
                                    X: =4
                                    Y: =3
                        - lblBkAssetEmpty:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(139, 148, 163, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Fill: =RGBA(238, 241, 246, 1)
                              Font: =Font.'Segoe UI'
                              Height: =Self.Size * 2.9
                              LayoutMinHeight: =0
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =10
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Nothing chosen - type below to search"
                              Visible: =IsEmpty(colBkAssets)
                              Width: =Parent.Width
                              Wrap: =false
                              X: =103
                        - txtBkAssetSearch:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(211, 217, 226, 1)
                              Color: =RGBA(23, 35, 58, 1)
                              Default: =""
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Font: =Font.'Segoe UI'
                              HintText: =If(Parent.Width < 600, "Search ID, device, maker", "Type to search by ID, device or manufacturer")
                              HoverBorderColor: =RGBA(10, 74, 147, 1)
                              HoverColor: =RGBA(23, 35, 58, 1)
                              HoverFill: =RGBA(255, 255, 255, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PressedBorderColor: =RGBA(0, 46, 101, 1)
                              PressedColor: =RGBA(23, 35, 58, 1)
                              PressedFill: =RGBA(255, 255, 255, 1)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                              Y: =(Parent.Height - Self.Height) / 2
                        - galBkAssetResults:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderColor: =RGBA(232, 236, 242, 1)
                              Height: =Parent.Height
                              Items: |-
                                =With(
                                    { q: Lower(Trim(txtBkAssetSearch.Text)) },
                                    FirstN(
                                        Sort(
                                            Filter(
                                                Equipment_Assets,
                                                !IsBlank(Find(q, Lower(Coalesce(Titel, ""))))
                                                    || !IsBlank(Find(q, Lower(Coalesce(DeviceName, ""))))
                                                    || !IsBlank(Find(q, Lower(Coalesce(Manufacturer, ""))))
                                                    || !IsBlank(Find(q, Lower(Coalesce(SerialNumber, ""))))
                                            ),
                                            Titel
                                        ),
                                        25
                                    )
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              TemplateSize: =If(Parent.Width < 600, 84, 72)
                              Visible: =!IsBlank(txtBkAssetSearch.Text)
                              Width: =Parent.Width
                            Children:
                              - lblBkAssetRowName:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(23, 35, 58, 1)
                                    DisabledColor: =RGBA(139, 148, 163, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =If(Parent.TemplateWidth < 420, 58, 40)
                                    OnSelect: |-
                                      =If(
                                          IsBlank(LookUp(colBkAssets, Value = ThisItem.Titel)),
                                          Collect(
                                              colBkAssets,
                                              { Id: ThisItem.'Id (ID)', Value: ThisItem.Titel }
                                          )
                                      );
                                      Reset(txtBkAssetSearch)
                                    PaddingBottom: =0
                                    PaddingLeft: =8
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: |-
                                      =ThisItem.Titel & " - " & ThisItem.DeviceName &
                                      If(
                                          IsBlank(ThisItem.Manufacturer),
                                          "",
                                          "  (" & ThisItem.Manufacturer & ")"
                                      )
                                    Width: =Parent.TemplateWidth - 8
                                    X: =4
                                    Y: =4
                              - lblBkAssetRowSub:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(90, 101, 119, 1)
                                    DisabledColor: =RGBA(139, 148, 163, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                                    Height: =18
                                    OnSelect: |-
                                      =If(
                                          IsBlank(LookUp(colBkAssets, Value = ThisItem.Titel)),
                                          Collect(
                                              colBkAssets,
                                              { Id: ThisItem.'Id (ID)', Value: ThisItem.Titel }
                                          )
                                      );
                                      Reset(txtBkAssetSearch)
                                    PaddingBottom: =0
                                    PaddingLeft: =8
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10
                                    Text: |-
                                      ="SN " & Coalesce(ThisItem.SerialNumber, "-") &
                                       "   |   " & Coalesce(ThisItem.CurrentCampus.Value, "?") &
                                       " / " & Coalesce(ThisItem.'CurrentLocation (CurrentLocation0)'.Value, "?") &
                                       "   |   " & Coalesce(ThisItem.Status.Value, "")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.TemplateWidth - 8
                                    Wrap: =false
                                    X: =4
                                    Y: =lblBkAssetRowName.Y + lblBkAssetRowName.Height
                              - recBkAssetRowSep:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(232, 236, 242, 1)
                                    Height: =1
                                    OnSelect: |-
                                      =If(
                                          IsBlank(LookUp(colBkAssets, Value = ThisItem.Titel)),
                                          Collect(
                                              colBkAssets,
                                              { Id: ThisItem.'Id (ID)', Value: ThisItem.Titel }
                                          )
                                      );
                                      Reset(txtBkAssetSearch)
                                    # Always. This came from the browse template, where the rectangle is
                                    # the highlight on the selected row - so it only ever drew on one row.
                                    # Here it is a divider, a cell background or a colour strip, and it has
                                    # to be there on every row.
                                    Visible: =true
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - 1
                  - conBkStart:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        FillPortions: =0
                        Height: =76
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =If(Parent.Width < 720, Parent.Width - 28, (Parent.Width - 40) / 2)
                      Children:
                        - lblBkStart:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(90, 101, 119, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: ="START DATE *"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                              X: =103
                        - btnBkStartDate:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(211, 217, 226, 1)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =1
                              Color: =RGBA(23, 35, 58, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(238, 241, 246, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =Set(varPickMonth, Date(Year(varBkStart), Month(varBkStart), 1));
                                Set(varPickTarget, "start")
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(10, 74, 147, 1)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =13
                              Text: =Text(varBkStart, DateTimeFormat.LongDate)
                              Width: =Parent.Width
                  - conBkEnd:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        FillPortions: =0
                        Height: =76
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =If(Parent.Width < 720, Parent.Width - 28, (Parent.Width - 40) / 2)
                      Children:
                        - lblBkEnd:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(90, 101, 119, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: ="END DATE *"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                              X: =103
                        - btnBkEndDate:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(211, 217, 226, 1)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =1
                              Color: =RGBA(23, 35, 58, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(238, 241, 246, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =Set(varPickMonth, Date(Year(varBkEnd), Month(varBkEnd), 1));
                                Set(varPickTarget, "end")
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(10, 74, 147, 1)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =13
                              Text: =Text(varBkEnd, DateTimeFormat.LongDate)
                              Width: =Parent.Width
                  - conBkRoom:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        FillPortions: =0
                        Height: =100
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =If(Parent.Width < 720, Parent.Width - 28, (Parent.Width - 40) / 2)
                      Children:
                        - lblBkRoom:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(90, 101, 119, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: ="ROOM"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                              X: =103
                        - drpBkRoom:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              AllowEmptySelection: =true
                              BorderColor: =RGBA(211, 217, 226, 1)
                              ChevronBackground: =RGBA(238, 241, 246, 1)
