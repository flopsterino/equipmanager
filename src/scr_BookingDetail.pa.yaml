            - galPickDays:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =RGBA(232, 236, 242, 1)
                  Height: =Parent.Height
                  Items: |-
                    =With(
                        {
                            first: DateAdd(
                                varPickMonth,
                                -(Weekday(varPickMonth, StartOfWeek.Monday) - 1),
                                TimeUnit.Days
                            )
                        },
                        ForAll(
                            Sequence(42) As s,
                            With(
                                { d: DateAdd(first, s.Value - 1, TimeUnit.Days) },
                                {
                                    CellDate: d,
                                    DayNum: Day(d),
                                    InMonth: Month(d) = Month(varPickMonth)
                                }
                            )
                        )
                    )
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  ShowScrollbar: =false
                  TemplateSize: =42
                  Width: =Parent.Width - 16
                  WrapCount: =7
                Children:
                  - recPickCell:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(232, 236, 242, 1)
                        BorderThickness: =1
                        Fill: |-
                          =If(
                              ThisItem.CellDate = If(varPickTarget = "start", varBkStart, varBkEnd),
                                  RGBA(0, 46, 101, 1),
                              ThisItem.CellDate = Today(), RGBA(222, 236, 249, 1),
                              RGBA(255, 255, 255, 1)
                          )
                        Height: =Parent.TemplateHeight - 2
                        OnSelect: |-
                          =If(
                              varPickTarget = "start",
                              Set(varBkStart, ThisItem.CellDate);
                              // Keep the range sane: an end before the new start moves along.
                              If(varBkEnd < ThisItem.CellDate, Set(varBkEnd, ThisItem.CellDate)),
                              Set(varBkEnd, ThisItem.CellDate)
                          );
                          Set(varPickTarget, "")
                        # Always. This came from the browse template, where the rectangle is
                        # the highlight on the selected row - so it only ever drew on one row.
                        # Here it is a divider, a cell background or a colour strip, and it has
                        # to be there on every row.
                        Visible: =true
                        Width: =Parent.TemplateWidth - 2
                        X: =1
                        Y: =1
                  - lblPickDayNum:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: |-
                          =If(
                              ThisItem.CellDate = If(varPickTarget = "start", varBkStart, varBkEnd),
                                  RGBA(255, 255, 255, 1),
                              Not(ThisItem.InMonth), RGBA(203, 210, 221, 1),
                              RGBA(23, 35, 58, 1)
                          )
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                        Height: =Parent.TemplateHeight - 4
                        OnSelect: |-
                          =If(
                              varPickTarget = "start",
                              Set(varBkStart, ThisItem.CellDate);
                              // Keep the range sane: an end before the new start moves along.
                              If(varBkEnd < ThisItem.CellDate, Set(varBkEnd, ThisItem.CellDate)),
                              Set(varBkEnd, ThisItem.CellDate)
                          );
                          Set(varPickTarget, "")
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =ThisItem.DayNum
