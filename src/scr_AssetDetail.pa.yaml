Screens:
  scr_AssetDetail:
    Properties:
      Fill: RGBA(244, 245, 247, 1)
      LoadingSpinnerColor: =RGBA(0, 46, 101, 1)
      OnVisible: |-
        =// Haal het record opnieuw op zodat bewerkingen elders meteen zichtbaar zijn.
        If(
            !IsBlank(varCurrentAsset.'Id (ID)'),
            Set(varCurrentAsset, LookUp(Equipment_Assets, 'Id (ID)' = varCurrentAsset.'Id (ID)'))
        );
        Set(
            varAssetFields,
            Table(
                { FieldName: "Device name",            FieldValue: Coalesce(varCurrentAsset.DeviceName, "-") },
        { FieldName: "Manufacturer",           FieldValue: Coalesce(varCurrentAsset.Manufacturer, "-") },
                { FieldName: "Serial number",            FieldValue: Coalesce(varCurrentAsset.SerialNumber, "-") },
                { FieldName: "UA number",              FieldValue: Coalesce(varCurrentAsset.UANumber, "-") },
                { FieldName: "Setup(s)",               FieldValue: If(
                    IsEmpty(varCurrentAsset.Setups),
                    "-",
                    Concat(varCurrentAsset.Setups, Value, ", ")
                ) },
                { FieldName: "Campus",                 FieldValue: Coalesce(varCurrentAsset.CurrentCampus.Value, "-") },
                { FieldName: "Room",                 FieldValue: Coalesce(varCurrentAsset.'CurrentLocation (CurrentLocation0)'.Value, "-") },
                { FieldName: "Owner group",         FieldValue: Coalesce(varCurrentAsset.OwnerGroup.Value, "-") },
                { FieldName: "User group",        FieldValue: Coalesce(varCurrentAsset.UserGroup.Value, "-") },
                { FieldName: "Status",                 FieldValue: Coalesce(varCurrentAsset.Status.Value, "-") },
                { FieldName: "Assigned to",          FieldValue: Coalesce(varCurrentAsset.CurrentHolder.DisplayName, "-") },
                { FieldName: "Last moved by", FieldValue: Coalesce(varCurrentAsset.LastRelocatedBy.DisplayName, "-") },
                { FieldName: "Last maintenance",      FieldValue: If(IsBlank(varCurrentAsset.LastMaintenanceDate), "-", Text(varCurrentAsset.LastMaintenanceDate, DateTimeFormat.ShortDate)) },
                { FieldName: "Next maintenance",      FieldValue: If(IsBlank(varCurrentAsset.NextMaintenanceDue), "-", Text(varCurrentAsset.NextMaintenanceDue, DateTimeFormat.ShortDate)) },
                { FieldName: "Commissioning required", FieldValue: Coalesce(varCurrentAsset.CommissioningRequired.Value, "-") },
        { FieldName: "Commissioning done",     FieldValue: If(
            IsEmpty(varCurrentAsset.CommissioningDone),
            "-",
            Concat(varCurrentAsset.CommissioningDone, Value, ", ")
        ) },
        { FieldName: "Last updated",      FieldValue: If(IsBlank(varCurrentAsset.LastUpdated), "-", Text(varCurrentAsset.LastUpdated, DateTimeFormat.ShortDateTime24)) }
            )
        )
    Children:
      - conAssetDetail:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - conAssetHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =112
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - icoAssetBack:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Back to overview"
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(90, 101, 119, 1)
                        DisabledBorderColor: =RGBA(238, 241, 246, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =36
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(10, 74, 147, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.BackArrow
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        # Back() returns to the screen shown before this one. After saving an edit
                        # that is the edit screen, so back led straight back into editing. This
                        # goes to where the asset was opened from instead: the setup it belongs
                        # to, or the overview.
                        OnSelect: |-
                          =If(
                              varAssetFromSetup,
                              Navigate(scr_SetupDetail, ScreenTransition.Fade),
                              Navigate(scr_Home, ScreenTransition.Fade)
                          )
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(10, 74, 147, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Tooltip: ="Back"
                        Width: =36
                        X: =010
                        Y: =(Parent.Height - Self.Height) / 2
                  - conAssetTitleBlock:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =200
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =Parent.Width
                      Children:
                        - lblAssetTitle:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(23, 35, 58, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Self.Size * 2.9
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =If(Parent.Width < 400, 16, If(Parent.Width < 600, 18, 20))
                              Text: =Coalesce(varCurrentAsset.Titel, "No asset selected")
                              Width: =Parent.Width
                              X: =103
                        - lblAssetSubtitle:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(90, 101, 119, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              Height: =Self.Size * 2.9
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =Coalesce(varCurrentAsset.DeviceName, "") & "   |   " &
                                 Coalesce(varCurrentAsset.CurrentCampus.Value, "?") & " / " &
                                 Coalesce(varCurrentAsset.'CurrentLocation (CurrentLocation0)'.Value, "?")
                              Width: =Parent.Width
                              X: =103
            - conAssetBadges:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - lblAssetCommBadge:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Fill: |-
                          =With(
                              {
                                  req: Coalesce(varCurrentAsset.CommissioningRequired.Value, "None"),
                                  // "None" in the done list says the same thing as an empty list: nothing
                                  // has been commissioned. Dropping it makes the two spellings of that one
                                  // state behave alike, instead of one reading as "something was done,
                                  // but not this".
                                  done: Concat(
                                      Filter(varCurrentAsset.CommissioningDone, Value <> "None"),
                                      Value,
                                      " | "
                                  )
                              },
                              If(
                                  req = "None",                       RGBA(27, 94, 52, 1),
                                  // Commissioned at this campus, among possibly several.
                                  !IsBlank(Find(req, done)),          RGBA(27, 94, 52, 1),
                                  // An extended commissioning covers the administrative one.
                                  req = "administrative"
                                      && !IsBlank(Find("extended", done)),
                                                                      RGBA(27, 94, 52, 1),
                                  IsBlank(done),                      RGBA(163, 18, 28, 1),
                                  // Something was done, but not what this asset needs.
                                  RGBA(138, 75, 0, 1)
                              )
                          )
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Self.Size * 2.9
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =0
                        Size: =If(Parent.Width < 600, 10, 11)
                        Text: |-
                          =With(
                              {
                                  req: Coalesce(varCurrentAsset.CommissioningRequired.Value, "None"),
                                  // "None" in the done list says the same thing as an empty list: nothing
                                  // has been commissioned. Dropping it makes the two spellings of that one
                                  // state behave alike, instead of one reading as "something was done,
                                  // but not this".
                                  done: Concat(
                                      Filter(varCurrentAsset.CommissioningDone, Value <> "None"),
                                      Value,
                                      " | "
                                  )
                              },
                              If(
                                  req = "None",                       "Not required",
                                  // Commissioned at this campus, among possibly several.
                                  !IsBlank(Find(req, done)),          "Commissioned",
                                  // An extended commissioning covers the administrative one.
                                  req = "administrative"
                                      && !IsBlank(Find("extended", done)),
                                                                      "Commissioned",
                                  IsBlank(done),                      "Not commissioned",
                                  // Something was done, but not what this asset needs.
                                  "Incomplete"
                              )
                          )
                        Visible: =!IsBlank(varCurrentAsset.'Id (ID)')
                        Width: =If(Parent.Width < 600, 118, 150)
                        X: =103
                  - lblAssetStatusBadge:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Fill: |-
                          =Switch(
                              varCurrentAsset.Status.Value,
                              "Available", RGBA(27, 94, 52, 1),
                              "In-use",    RGBA(196, 137, 0, 1),
                              RGBA(90, 101, 119, 1)
                          )
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Self.Size * 2.9
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =If(Parent.Width < 600, 10, 11)
                        Text: =Coalesce(varCurrentAsset.Status.Value, "Unknown")
                        Visible: =!IsBlank(varCurrentAsset.'Id (ID)')
                        Width: =If(Parent.Width < 600, 84, 110)
                        X: =103
            - conAssetBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - lblFieldsHeader:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(90, 101, 119, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Fill: =RGBA(238, 241, 246, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: ="DETAILS"
                        Width: =Parent.Width - 16
                        X: =103
                  - galAssetFields:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(238, 241, 246, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =CountRows(varAssetFields) * 44
                        Items: =varAssetFields
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        ShowScrollbar: =false
                        TemplateSize: =44
                        Width: =Parent.Width - 16
                      Children:
                        - lblFieldName:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(90, 101, 119, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =44
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =8
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =ThisItem.FieldName
                              Width: =Min(Parent.TemplateWidth * 0.45, 210)
                              Wrap: =false
                        - lblFieldValue:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(23, 35, 58, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =8
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =ThisItem.FieldValue
                              Width: =Parent.TemplateWidth - lblFieldName.Width - 8
                              Wrap: =false
                              X: =lblFieldName.Width
                        - recFieldSep:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(232, 236, 242, 1)
                              Height: =1
                              OnSelect: =Select(Parent)
                              Visible: =ThisItem.IsSelected
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 1
                  - lblDocsHeader:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(90, 101, 119, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Fill: =RGBA(238, 241, 246, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: ="DOCUMENTS"
                        Width: =Parent.Width - 16
                        X: =103
                  - btnOpenAssetDocs:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(211, 217, 226, 1)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =1
                        Color: =RGBA(0, 46, 101, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        Height: =36
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(232, 239, 248, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Launch(
                              "https://uantwerpen.sharepoint.com/sites/LabEquipmentHub/Assets_Documents/Forms/AllItems.aspx?id=" &
                                  EncodeUrl("/sites/LabEquipmentHub/Assets_Documents/" & varCurrentAsset.Titel),
                              {},
                              LaunchTarget.New
                          )
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(10, 74, 147, 1)
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =12
                        Text: ="Open this device's folder"
                        Width: =If(Parent.Width < 600, Parent.Width - 16, 300)
                  - galAssetDocs:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(238, 241, 246, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =120
                        Items: |-
                          =Filter(
                              Assets_Documents,
                              Not('{IsFolder}'),
                              EndsWith('{Path}', "/" & varCurrentAsset.Titel & "/")
                                  || AssetID = varCurrentAsset.Titel
                          )
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        TemplateSize: =48
                        Width: =Parent.Width - 16
                      Children:
                        - lblDocName:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(0, 46, 101, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =48
                              OnSelect: =Launch(ThisItem.'{Link}')
                              PaddingBottom: =0
                              PaddingLeft: =8
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =ThisItem.'{FilenameWithExtension}'
                              Underline: =true
                              Width: =Parent.TemplateWidth - 130
                              Wrap: =false
                              X: =4
                        - lblDocType:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(139, 148, 163, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =48
                              OnSelect: =Launch(ThisItem.'{Link}')
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =8
                              PaddingTop: =0
                              Size: =11
                              Text: =Coalesce(ThisItem.DocumentType.Value, "")
                              Width: =120
                              Wrap: =false
                              X: =Parent.TemplateWidth - Self.Width - 4
                  - lblNoDocs:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(139, 148, 163, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Font: =Font.'Segoe UI'
                        Height: =28
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: ="No documents yet. Open the folder to add one."
                        Visible: =CountRows(galAssetDocs.AllItems) = 0
                        Width: =Parent.Width - 16
                        X: =103
                  - lblHistoryHeader:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(90, 101, 119, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Fill: =RGBA(238, 241, 246, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: ="MOVE HISTORY"
                        Width: =Parent.Width - 16
                        X: =103
                  - galAssetHistory:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(238, 241, 246, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =180
                        Items: |-
                          =Sort(
                              Filter(Equipment_MovementLog, Title = varCurrentAsset.Titel),
                              TimeStamp,
                              SortOrder.Descending
                          )
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        TemplateSize: =44
                        Width: =Parent.Width - 16
                      Children:
                        - lblMoveLine:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(23, 35, 58, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =22
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =8
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =Coalesce(ThisItem.FromLocation.Value, "?") & "  ->  " &
                                 Coalesce(ThisItem.ToLocation.Value, "?")
                              Width: =Parent.TemplateWidth - 16
                              Wrap: =false
                              X: =4
                              Y: =2
                        - lblMoveMeta:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(139, 148, 163, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =18
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =8
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =10
                              Text: |-
                                =If(IsBlank(ThisItem.TimeStamp), "", Text(ThisItem.TimeStamp, DateTimeFormat.ShortDateTime24)) &
                                 "   |   " & Coalesce(ThisItem.MovedBy.DisplayName, "?") &
                                 "   |   " & Coalesce(ThisItem.ActionType.Value, "")
                              Width: =Parent.TemplateWidth - 16
                              Wrap: =false
                              X: =4
                              Y: =23
                        - recHistSep:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(232, 236, 242, 1)
                              Height: =1
                              OnSelect: =Select(Parent)
                              Visible: =ThisItem.IsSelected
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 1
                  - lblNoHistory:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(139, 148, 163, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Font: =Font.'Segoe UI'
                        Height: =28
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: ="This asset has not been moved through the app yet."
                        Visible: =CountRows(galAssetHistory.AllItems) = 0
                        Width: =Parent.Width - 16
                        X: =103
                  - lblAssetTicketsHeader:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(90, 101, 119, 1)
                        DisabledColor: =RGBA(139, 148, 163, 1)
                        Fill: =RGBA(238, 241, 246, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: ="ISSUES"
                        Width: =Parent.Width - 16
                        X: =103
                  - galAssetTickets:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(238, 241, 246, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =170
                        Items: |-
                          =Sort(
                              Filter(Equipment_Tickets, Title = varCurrentAsset.Titel),
                              ReportedDate,
                              SortOrder.Descending
                          )
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        TemplateSize: =56
                        Width: =Parent.Width - 16
                      Children:
                        - lblAssetTicketLine:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(23, 35, 58, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =22
                              OnSelect: |-
                                =Set(varCurrentTicket, ThisItem);
                                Navigate(scr_TicketDetail, ScreenTransition.Fade)
                              PaddingBottom: =0
                              PaddingLeft: =8
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =Coalesce(ThisItem.TypeMaintenance.Value, "Problem") &
                                 If(IsBlank(ThisItem.Severity.Value), "", "   (" & ThisItem.Severity.Value & ")") &
                                 "   -   " & Left(Coalesce(ThisItem.Description, ""), 70)
                              Width: =Parent.TemplateWidth - 120
                              Wrap: =false
                              X: =4
                              Y: =4
                        - lblAssetTicketMeta:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(139, 148, 163, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =20
                              OnSelect: |-
                                =Set(varCurrentTicket, ThisItem);
                                Navigate(scr_TicketDetail, ScreenTransition.Fade)
                              PaddingBottom: =0
                              PaddingLeft: =8
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =10
                              Text: |-
                                ="reported by " & Coalesce(ThisItem.ReportedBy.DisplayName, "?") &
                                 If(IsBlank(ThisItem.ReportedDate), "", " on " & Text(ThisItem.ReportedDate, DateTimeFormat.ShortDate)) &
                                 If(
                                     IsBlank(ThisItem.ResolvedDate),
                                     "",
                                     "   |   resolved by " & Coalesce(ThisItem.ResolvedBy.DisplayName, "?") &
                                     ": " & Left(Coalesce(ThisItem.ResolutionNotes, "no notes"), 60)
                                 )
                              Width: =Parent.TemplateWidth - 120
                              Wrap: =false
                              X: =4
                              Y: =28
                        - lblAssetTicketBadge:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledColor: =RGBA(139, 148, 163, 1)
                              Fill: |-
                                =If(
                                    IsBlank(ThisItem.ResolvedDate),
                                    RGBA(196, 89, 17, 1),
                                    RGBA(27, 94, 52, 1)
                                )
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =22
                              OnSelect: |-
                                =Set(varCurrentTicket, ThisItem);
                                Navigate(scr_TicketDetail, ScreenTransition.Fade)
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =10
                              Text: =If(IsBlank(ThisItem.ResolvedDate), "Open", "Resolved")
                              Width: =90
                              Wrap: =false
                              X: =Parent.TemplateWidth - Self.Width - 14
                              Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                        - recAssetTicketSep:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(232, 236, 242, 1)
                              Height: =1
                              OnSelect: |-
                                =Set(varCurrentTicket, ThisItem);
                                Navigate(scr_TicketDetail, ScreenTransition.Fade)
                              Visible: =ThisItem.IsSelected
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 1
