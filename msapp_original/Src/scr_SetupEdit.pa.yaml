Screens:
  scr_SetupEdit:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varIsNewSetup, IsBlank(varEditSetup.'Id (ID)'));
        // Preload the responsible person from the existing record, so editing any
        // other field does not silently clear it.
        Set(
            varSetupHolder,
            {
                DisplayName: Coalesce(varEditSetup.ResponsiblePerson.DisplayName, ""),
                Mail: Coalesce(varEditSetup.ResponsiblePerson.Email, "")
            }
        )
    Children:
      - conSetupEdit:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
